}

  '<div class="process-grid">' +
    (S.processSteps||[]).map(function(s,i,arr){return '<div class="process-step">'+
      '<div class="process-dot'+(s.done?'':' hollow')+'"></div>'+(i<arr.length-1?'<div class="process-line"></div>':'')+
      '<div class="process-label">STEP '+String(i+1).padStart(2,'0')+'</div>'+
      '<div class="process-title">'+esc(s.title)+'</div>'+
      '<div class="process-desc">'+esc(s.desc)+'</div></div>';}).join('') +
  '</div>' +
'</div></section>' +

'<section id="notes" class="notes section-light"><div class="container"><div class="notes-grid">' +
  '<div class="notes-left"><div class="eyebrow" style="color:var(--navy-3);">NOTES</div><div class="section-title">預約<br>注意事項</div></div>' +
  '<div class="notes-right">' +
    (S.noteItems||[]).map(function(n,i){return '<div class="note-item"><div class="note-item-label">N.'+String(i+1).padStart(2,'0')+'</div><div class="note-item-title">'+esc(n.title)+'</div><div class="note-item-desc">'+esc(n.desc)+'</div></div>';}).join('') +
  '</div>' +
'</div></div></section>' +

(LATEST_POSTS.length ?
'<section id="latest" class="latest section-light"><div class="container">' +
  '<div class="eyebrow" style="color:var(--navy-3);">ARTICLES</div><div class="section-title">最新文章</div>' +
  '<div class="latest-grid">' + LATEST_POSTS.map(function(p){return '<a class="latest-card" href="'+p.url+'">'+(p.image?'<img src="'+p.image+'" alt="" loading="lazy">':'')+'<div class="latest-body">'+(p.cat?'<div class="latest-cat">'+esc(p.cat)+'</div>':'')+'<div class="latest-title">'+esc(p.title)+'</div><div class="latest-desc">'+esc(p.desc||'')+'</div></div></a>';}).join('') + '</div>' +
  '<div style="text-align:center;margin-top:24px"><a href="/blog/" class="about-more">看所有文章 →</a></div>' +
'</div></section>' : '') +

'<section id="faq" class="faq section-white"><div class="container">' +
  '<div class="eyebrow" style="text-align:center;color:var(--navy-3);">FAQ</div>' +
  '<div class="section-title" style="text-align:center;">常見問題</div>' +
  '<div class="faq-list">' +
    (S.faqItems||[]).map(function(f){return '<div class="faq-item"><div class="faq-q" onclick="this.parentElement.classList.toggle(\'open\')">'+esc(f.q)+'</div><div class="faq-a"><div class="faq-a-inner">'+esc(f.a)+'</div></div></div>';}).join('') +
  '</div>' +
'</div></section>' +


'<section class="cta-section section-dark"><div class="container">' +
  '<div class="section-title">' + esc(S.ctaTitle||'') + '</div>' +
  '<p>' + esc(S.ctaDesc||'') + '</p>' +
  '<div class="hero-btns" style="justify-content:center"><a href="/booking/" class="btn-primary">預約一對一諮詢</a>' +
  '<a href="'+(S.lineUrl||'')+'" target="_blank" rel="noopener" class="btn-warm">先加入 LINE 聊聊</a></div>' +
'</div></section>' +

'<footer class="footer"><div class="container">' +
  renderSocialLinks(S.socialLinks) +
  '<p>' + (S.footerText||'') + '　·　<a href="/privacy-policy/" style="color:inherit">隱私權政策</a></p>' +
'</div></footer>';
}

// 先用 SITE 預設值立即渲染（SEO + 快速顯示）
renderSite(SITE);

// 背景載入試算表最新資料，有更新就重新渲染（不用重新部署 Netlify）
(function() {
  var apiBase = SITE.bookingFormUrl;
  if (!apiBase || apiBase === 'YOUR_APPS_SCRIPT_URL') return;
  var s = document.createElement('script');
  s.src = apiBase + '?page=siteConfig&callback=_siteConfigCb';
  window._siteConfigCb = function(data) {
    if (!data) return;
    var merged = {};
    for (var k in SITE) merged[k] = SITE[k];
    for (var k in data) if (data[k] !== '' && data[k] !== undefined) merged[k] = data[k];

    // 「關於我」三段文字（後台是拆成 aboutP1/aboutP2/aboutP3 三個欄位存的）
    if (data.aboutP1 || data.aboutP2 || data.aboutP3) {
      merged.aboutParagraphs = [data.aboutP1, data.aboutP2, data.aboutP3].filter(Boolean);
    }

    // 「我會做的事／不會做的事」（後台是 aboutDo1~4／aboutDont1~4 四個欄位存的，留空的那格不會出現在清單裡）
    var aboutDo = [data.aboutDo1, data.aboutDo2, data.aboutDo3, data.aboutDo4].filter(Boolean);
    if (aboutDo.length) merged.aboutDo = aboutDo;
    var aboutDont = [data.aboutDont1, data.aboutDont2, data.aboutDont3, data.aboutDont4].filter(Boolean);
    if (aboutDont.length) merged.aboutDont = aboutDont;

    // 我的諮詢風格（後台 style1~3 的 Title/Sub/Desc，標題留空代表這張不顯示）
    var styleItems = [];
    for (var si = 1; si <= 3; si++) {
      var st = data['style' + si + 'Title'];
      if (st) styleItems.push({ title: st, sub: data['style' + si + 'Sub'] || '', desc: data['style' + si + 'Desc'] || '' });
    }
    if (styleItems.length) merged.styleItems = styleItems;

    // Hero 資訊卡（後台開了 5 格 heroCard1Label/Value ~ heroCard5Label/Value，標籤跟內容都填了才算一格）
    var heroCards = [];
    for (var i = 1; i <= 5; i++) {
      var label = data['heroCard' + i + 'Label'], value = data['heroCard' + i + 'Value'];
      if (label && value) heroCards.push({ label: label, value: value });
    }
    if (heroCards.length) merged.heroInfoCard = heroCards;

    // 第一次諮詢怎麼進行（後台開了 6 格 first1When/Title/Desc ~ first6…，標題留空代表這格不使用）
    var firsts = [];
    for (var fi = 1; fi <= 6; fi++) {
      var ft = data['first' + fi + 'Title'];
      if (ft) firsts.push({ when: data['first' + fi + 'When'] || '', title: ft, desc: data['first' + fi + 'Desc'] || '' });
    }
    if (firsts.length) merged.firstSteps = firsts;

    // 預約流程（後台開了 6 格，標題留空代表這格不使用）
    var steps = [];
    for (var i = 1; i <= 6; i++) {
      var title = data['processStep' + i + 'Title'];
      if (title) steps.push({ title: title, desc: data['processStep' + i + 'Desc'] || '', done: data['processStep' + i + 'Done'] === true });
    }
    if (steps.length) merged.processSteps = steps;

    // 注意事項（後台開了 6 格，標題留空代表這格不使用）
    var notes = [];
    for (var i = 1; i <= 6; i++) {
      var title = data['note' + i + 'Title'];
      if (title) notes.push({ title: title, desc: data['note' + i + 'Desc'] || '' });
    }
    if (notes.length) merged.noteItems = notes;

    // 常見問題（後台開了 8 格，問題留空代表這格不使用）
    var faqs = [];
    for (var i = 1; i <= 8; i++) {
      var q = data['faq' + i + 'Q'];
      if (q) faqs.push({ q: q, a: data['faq' + i + 'A'] || '' });
    }
    if (faqs.length) merged.faqItems = faqs;

    // 社群連結（後台用 social_facebook／social_instagram... 這種攤平欄位存網址，key／label／color 還是用網頁預設的）
    merged.socialLinks = (SITE.socialLinks || []).map(function (s) {
      var url = data['social_' + s.key];
      return url ? Object.assign({}, s, { url: url }) : s;
    });

    renderSite(merged);
  };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
