<style>
@font-face{font-family:"Dazhen WenKai";src:url("/fonts/dazhen-wenkai-400.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Dazhen WenKai";src:url("/fonts/dazhen-wenkai-700.woff2") format("woff2");font-weight:700;font-display:swap}
/* 2026-10-11 首頁改版：開場 → 服務與價格 → 關於大正（精簡）→ 第一次諮詢 → 預約流程 → 預約規則 → 常見問題 → 最新文章 → 結尾 */
:root{--navy:#1b2845;--navy-2:#21304c;--navy-3:#3d5467;--cream:#f5f3ef;--accent:#6292ab;--accent-d:#4f7d94;--warm:#cc8854;--warm-d:#b07545;--text-light:#c8cdd4;--text-muted:#8a95a5;--body:#57534e;--line:#e5e8ec}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;line-break:strict;word-break:auto-phrase;text-autospace:normal;overflow-wrap:break-word}
body{font-family:"Dazhen WenKai","LXGW WenKai TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--navy);background:var(--cream);line-height:1.8;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}a{color:inherit;text-decoration:none}
h1,h2,h3,h4{text-wrap:balance}p,li{text-wrap:pretty}
.container{max-width:1100px;margin:0 auto;padding:0 24px}
@media(max-width:480px){.container{padding:0 18px}}
.sec{padding:72px 0}
.section-dark{background:var(--navy);color:#fff}.section-light{background:var(--cream)}.section-white{background:#fff}
.eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--navy-3);font-weight:700;margin-bottom:8px}
.section-dark .eyebrow{color:var(--accent)}
.section-title{font-size:clamp(26px,5vw,38px);font-weight:700;line-height:1.3;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 26px;border-radius:8px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;border:none;white-space:nowrap;transition:background .2s,transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn:focus-visible,a:focus-visible,button:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-d)}
.btn-warm{background:var(--warm);color:#fff}.btn-warm:hover{background:var(--warm-d)}
.btn-ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45)}.btn-ghost:hover{background:rgba(255,255,255,.08)}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.nav{position:sticky;top:0;z-index:100;background:rgba(27,40,69,.96);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.08)}
.nav-inner{display:flex;justify-content:space-between;align-items:center;height:56px;gap:16px}
.nav-brand{font-weight:700;color:#fff;letter-spacing:1px}.nav-brand i{font-style:normal;color:var(--warm)}
.nav-links{display:flex;gap:22px}.nav-links a{font-size:13px;color:var(--text-light)}.nav-links a:hover{color:#fff}
.nav-cta{background:var(--accent);color:#fff;padding:7px 16px;border-radius:6px;font-size:13px;font-weight:700;white-space:nowrap}
@media(max-width:900px){.nav-inner{flex-wrap:wrap;height:auto;padding-top:10px;row-gap:6px}.nav-links{order:3;width:100%;display:flex;gap:18px;overflow-x:auto;white-space:nowrap;padding:2px 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.nav-links::-webkit-scrollbar{display:none}.nav-links a{padding:8px 0}.nav-links{padding-bottom:2px;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}[id]{scroll-margin-top:112px}}/* 手機：選單放第二行，可以左右滑（以前直接隱藏，手機看不到「關於大正」等項目） */
.hero{padding:64px 0 56px}
.hero-inner{display:grid;grid-template-columns:1.25fr .75fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(36px,6vw,56px);line-height:1.2;color:#fff;margin-bottom:12px}.hero h1 i{font-style:normal;color:var(--warm)}
.hero-badge{display:inline-block;background:rgba(98,146,171,.15);border:1px solid rgba(98,146,171,.3);padding:4px 14px;border-radius:20px;font-size:11px;letter-spacing:2px;color:var(--accent);font-weight:700;margin-bottom:18px}
.tagline{font-size:20px;color:#fff;font-weight:700;margin-bottom:14px;letter-spacing:1px}
.hero-desc{color:var(--text-light);font-size:16px;line-height:1.9;margin-bottom:28px;max-width:34em}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:26px;padding-top:18px;border-top:1px solid rgba(255,255,255,.12);font-size:14px;color:var(--text-light)}
.stats span b{color:#fff;font-size:17px;margin-right:4px}
.lib-entry{padding:0 0 56px}
.lib-card{display:block;max-width:760px;margin:0 auto;background:var(--navy-2);border:1px solid rgba(204,136,84,.35);border-radius:16px;overflow:hidden;color:#fff;text-decoration:none;text-align:center;transition:border-color .15s,transform .15s}
.lib-card:hover{border-color:var(--warm);transform:translateY(-2px)}
.lib-img{position:relative;display:block;aspect-ratio:16/9}.lib-img img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.lib-play{position:absolute;right:16px;bottom:16px;width:58px;height:58px;border-radius:50%;background:rgba(204,136,84,.92);display:flex;align-items:center;justify-content:center;font-size:22px;padding-left:4px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.lib-txt{display:flex;flex-direction:column;align-items:center;gap:8px;padding:24px 28px 28px}
.lib-h{font-size:24px;font-weight:700;line-height:1.4}.lib-p{color:var(--text-light);font-size:15px;line-height:1.8;max-width:30em}
.lib-btn{margin-top:6px;background:var(--warm);color:#fff;padding:9px 22px;border-radius:8px;font-weight:700;font-size:14px}
.stat-lib{display:inline-flex;align-items:center;gap:7px;color:#fff;font-size:14px;border-bottom:1px dashed rgba(204,136,84,.7);padding-bottom:1px}.stat-lib:hover{color:var(--warm)}.stat-lib img{width:18px;height:auto;image-rendering:pixelated}
@media(max-width:768px){.lib-entry{padding:0 0 44px}.lib-txt{padding:18px 20px 22px}.lib-h{font-size:20px}}
.hero-goat img{width:min(280px,100%);aspect-ratio:1;border-radius:50%;object-fit:cover;margin:0 auto}
@media(max-width:768px){.hero{padding:40px 0 44px}.hero-inner{grid-template-columns:1fr}.hero-goat{display:none}}
.svc-wrap{padding:8px 0 72px}
.svc-cards{display:grid;gap:24px}
.svc-card{background:var(--navy-2);border-radius:16px;padding:36px;display:grid;grid-template-columns:1.2fr .8fr;gap:32px;align-items:start}
.svc-card h3{font-size:24px;margin:4px 0 12px}.svc-card p{color:var(--text-light);line-height:1.9}
.svc-label{color:var(--warm);font-size:12px;letter-spacing:2px;font-weight:700}
.price{font-size:38px;font-weight:700;line-height:1.1}.price-unit{color:var(--text-muted);font-size:13px;margin-bottom:16px}
.svc-list{list-style:none;margin:0 0 22px;padding:0;display:grid;gap:10px;font-size:14px;color:var(--text-light)}
.svc-list li{display:flex;gap:10px;line-height:1.7}
.svc-list svg{flex:0 0 20px;width:20px;height:20px;margin-top:2px;fill:none;stroke:var(--warm);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.svc-card .btn{width:100%}
@media(max-width:768px){.svc-card{grid-template-columns:1fr;padding:26px 22px;gap:20px}}
.about-inner{display:grid;grid-template-columns:220px 1fr;gap:48px;align-items:start}
.about-photo{text-align:center}
.about-photo img,.about-photo .ph{width:180px;height:180px;border-radius:50%;object-fit:cover;margin:0 auto 12px}
.about-photo .ph{background:var(--navy-2);display:flex;align-items:center;justify-content:center;font-size:64px}
.about-photo strong{display:block;font-size:19px}.about-photo span{font-size:13px;color:var(--text-muted)}
.about-lead{color:var(--body);line-height:2;margin-bottom:22px;max-width:40em}
.dd,.fit{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dd>div{border-radius:12px;padding:18px 20px}.dd .do{background:rgba(98,146,171,.09)}.dd .dont{background:rgba(204,136,84,.09)}
.dd h4,.fit h4{font-size:15px;margin-bottom:8px}.dd .do h4{color:var(--accent-d)}.dd .dont h4{color:var(--warm-d)}
.dd ul{list-style:none;font-size:14px;color:var(--body);line-height:1.9}
.dd .do li::before{content:"✓ ";color:var(--accent);font-weight:700}.dd .dont li::before{content:"✗ ";color:var(--warm);font-weight:700}
.fit{margin-top:16px}.fit>div{border:1px solid var(--line);background:#fff;border-radius:12px;padding:16px 20px}
.fit ul{padding-left:1.2em;font-size:14px;color:var(--body);line-height:1.9}
.more{display:inline-block;margin-top:22px;font-weight:700;color:var(--accent-d);border-bottom:2px solid currentColor;padding-bottom:1px}
@media(max-width:768px){.about-inner{grid-template-columns:1fr;gap:20px}.about-photo{display:flex;align-items:center;gap:14px;text-align:left}.about-photo img,.about-photo .ph{width:84px;height:84px;margin:0;font-size:36px}.dd,.fit{grid-template-columns:1fr}}
.first-intro{color:var(--body);max-width:40em;margin-bottom:30px}
.first-list{list-style:none;max-width:760px;position:relative;display:grid;gap:22px}
.first-list::before{content:"";position:absolute;left:19px;top:20px;bottom:20px;width:2px;background:rgba(27,40,69,.12)}
.first-item{display:grid;grid-template-columns:40px 1fr;gap:16px;position:relative}
.first-num{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;position:relative;z-index:1}
.first-body{background:#fff;border-radius:14px;padding:16px 20px;box-shadow:0 2px 10px rgba(0,0,0,.04);min-width:0}
.first-when{font-size:12px;font-weight:700;color:var(--warm);letter-spacing:1px}
.first-title{font-size:17px;font-weight:700;margin:2px 0 4px}.first-desc{font-size:15px;color:var(--body);line-height:1.85}
.agenda{display:inline;list-style:none;padding:0;margin:0}
.agenda li{display:inline-block;font-size:13px;line-height:1.6;background:var(--cream);border-radius:999px;padding:1px 10px;margin:2px 6px 2px 0;white-space:nowrap}.agenda b{color:var(--warm);margin-right:4px}
.process-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:20px;margin-top:28px}
.process-grid.n4{grid-template-columns:repeat(4,1fr)}.process-grid.n6{grid-template-columns:repeat(3,1fr)}
.step-label{font-size:11px;letter-spacing:1px;color:var(--text-muted)}
.step-title{font-size:16px;font-weight:700;margin:4px 0 6px}.step-desc{font-size:13.5px;color:#78716c;line-height:1.75}
.step{position:relative}
.step-dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--accent);margin-bottom:10px;background:#fff;position:relative;z-index:1}.step-dot.done{background:var(--accent)}
.step:not(:last-child)::after{content:"";position:absolute;top:5px;left:16px;right:-16px;height:2px;background:rgba(98,146,171,.35)}
@media(min-width:901px){.process-grid.n6 .step:nth-child(3n)::after{display:none}}
@media(max-width:900px){.process-grid,.process-grid.n4,.process-grid.n6{grid-template-columns:1fr 1fr}.process-grid .step:nth-child(2n)::after{display:none}}
@media(max-width:480px){.process-grid,.process-grid.n4,.process-grid.n6{grid-template-columns:1fr}.process-grid .step:not(:last-child)::after{display:block;top:16px;bottom:-26px;left:5px;right:auto;width:2px;height:auto}.step{padding-left:24px}.step-dot{position:absolute;left:0;top:0;margin:0}}
.rules{max-width:860px;margin-top:24px;border-top:2px solid var(--navy)}
.rule{display:grid;grid-template-columns:150px 1fr;gap:20px;padding:16px 0;border-bottom:1px solid var(--line)}
.rule dt{font-weight:700;font-size:15px}.rule dd{color:var(--body);font-size:15px;line-height:1.85;min-width:0}
@media(max-width:560px){.rule{grid-template-columns:1fr;gap:2px}}
.faq-list{max-width:760px;margin:24px auto 0}
.faq-item{border-bottom:1px solid var(--line)}
.faq-q{width:100%;background:none;border:none;text-align:left;font-family:inherit;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:18px 0;font-size:15px;font-weight:700;color:var(--navy);cursor:pointer}
.faq-q::after{content:"+";font-size:20px;color:var(--accent);transition:transform .2s}
.faq-item.open .faq-q::after{transform:rotate(45deg)}
.faq-a{display:none;padding-bottom:18px;color:var(--body);font-size:14.5px;line-height:1.9}.faq-item.open .faq-a{display:block}
.posts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:22px}
.post{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.05);display:flex;flex-direction:column;transition:transform .15s}
.post:hover{transform:translateY(-3px)}
.post-img{aspect-ratio:3/2;background:var(--navy-2)}.post-img img{width:100%;height:100%;object-fit:cover}
.post-body{padding:14px 18px 18px;min-width:0}
.post-cat{font-size:12px;color:var(--warm);font-weight:700}
.post-title{font-size:17px;font-weight:700;line-height:1.5;margin-top:2px}
.post-desc{font-size:14px;color:var(--text-muted);line-height:1.7;margin-top:6px}
@media(max-width:820px){.posts{grid-template-columns:1fr;gap:12px}.post{flex-direction:row}.post-img{flex:0 0 112px;aspect-ratio:auto;min-height:112px}.post-body{padding:12px 14px}.post-title{font-size:15px}.post-desc{display:none}}
.cta{text-align:center}.cta p{color:var(--text-light);max-width:36em;margin:0 auto 26px}.cta .btns{justify-content:center}
.footer{background:var(--navy);border-top:1px solid rgba(255,255,255,.06);padding:24px 0;text-align:center;font-size:12px;color:var(--text-muted)}
.social-links{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.social-icon{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.social-icon:hover{transform:translateY(-2px)}
.social-icon svg{width:20px;height:20px;fill:#fff;display:block}
.social-icon.si-facebook{background:#fff}.social-icon.si-facebook svg{width:38px;height:38px;fill:#0866FF}
.social-icon.si-instagram{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285aeb 90%)}
.social-icon.si-threads{background:#000;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.social-icon.si-line{background:#06C755}.social-icon.si-line svg{width:22px;height:22px}
.sticky-cta{position:fixed;left:0;right:0;bottom:0;z-index:150;background:rgba(27,40,69,.97);border-top:1px solid rgba(255,255,255,.12);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:none;gap:8px;align-items:center;transform:translateY(110%);transition:transform .25s}
.sticky-cta.show{transform:none}
.sticky-cta .btn{flex:1;padding:11px 10px;font-size:14px}
.sticky-cta .x{flex:0 0 32px;height:32px;border:none;background:none;color:var(--text-muted);font-size:20px;cursor:pointer;font-family:inherit}
@media(max-width:767px){.sticky-cta{display:flex}body{padding-bottom:64px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn,.faq-q::after,.sticky-cta,.post{transition:none}}
</style>
{{ partial "analytics.html" . }}

function renderSocialLinks(list) {
  var items = (list || []).filter(function(s) { return s.url && String(s.url).trim(); });
  if (!items.length) return '';
  return '<div class="social-links">' + items.map(function(s) {
    var href = s.key === 'email' ? ('mailto:' + s.url) : s.url;
    var icon = SOCIAL_ICONS[s.key] || '';
    var brand = /^(facebook|instagram|threads|line)$/.test(s.key);
    return '<a href="' + esc(href) + '" target="_blank" rel="noopener" class="social-icon si-' + s.key + '"' + (brand ? '' : ' style="background:' + s.color + '"') + ' title="' + esc(s.label) + '" aria-label="' + esc(s.label) + '"' + (s.key === 'line' ? ' data-line' : '') + '><svg viewBox="0 0 24 24" aria-hidden="true">' + icon + '</svg></a>';

function renderServiceDetail(html) {
  var lines = String(html).split(/<br\s*\/?>|\n/i).map(function (l) {
    return l.replace(/<[^>]*>/g, '').replace(/^[\s\u2190-\u2BFF\uFE0F\u200D]+/, '').replace(/^(?:\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|\uD83E[\uDC00-\uDFFF])+\s*/, '').trim();
  }).filter(Boolean);
  return '<ul class="svc-list">' + lines.map(function (l) {
    var k = /分鐘|時間|題數/.test(l) ? 'time' : /面相|相機|鏡頭/.test(l) ? 'camera' : /Meet|視訊|線上/.test(l) ? 'video' : /LINE|語音|通話/.test(l) ? 'chat' : /文字|書面/.test(l) ? 'pen' : 'dot';
    return '<li><svg viewBox="0 0 24 24" aria-hidden="true">' + SVC_ICONS[k] + '</svg><span>' + esc(l) + '</span></li>';
  }).join('') + '</ul>';
}

function lines_(t) { return String(t || '').split(/\n|<br\s*\/?>/i).map(function (s) { return s.trim(); }).filter(Boolean); }

'<section id="about" class="sec section-light"><div class="container about-inner">' +

    '<div><strong>' + esc(S.aboutName||'') + '</strong><span>' + esc(S.aboutRole||'') + '</span></div></div>' +

    '<div class="eyebrow">ABOUT</div><h2 class="section-title">' + esc(S.aboutTitle||'') + '</h2>' +

    (aboutDo.length || aboutDont.length ? '<div class="dd">' +

      (aboutDont.length ? '<div class="dont"><h4>我不會做的事</h4><ul>' + aboutDont.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul></div>' : '') + '</div>' : '') +
    (fitYes.length || fitNo.length ? '<div class="fit">' +
      (fitYes.length ? '<div><h4>適合找我的人</h4><ul>' + fitYes.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul></div>' : '') +
      (fitNo.length ? '<div><h4>可能不適合的人</h4><ul>' + fitNo.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul></div>' : '') + '</div>' : '') +
    '<a class="more" href="/about/">更多關於大正與諮詢風格 →</a>' +
  '</div>' +
'</div></section>' +

((S.firstSteps||[]).length ?
'<section id="first-time" class="sec section-light" style="padding-top:0"><div class="container">' +
  '<div class="eyebrow">FIRST TIME</div><h2 class="section-title">第一次諮詢怎麼進行</h2>' +
  (S.firstIntro ? '<p class="first-intro">' + esc(S.firstIntro) + '</p>' : '') +
  '<ol class="first-list">' + S.firstSteps.map(function (f, i) {
    return '<li class="first-item"><div class="first-num">' + (i + 1) + '</div><div class="first-body">' + (f.when ? '<div class="first-when">' + esc(f.when) + '</div>' : '') +
      '<div class="first-title">' + esc(f.title) + '</div><div class="first-desc">' + esc(f.desc || '') +
      (agenda.length && i + 1 === agendaStep ? ' <ol class="agenda">' + agenda.map(function (a, j) { return '<li><b>' + (j + 1) + '</b>' + esc(a) + '</li>'; }).join('') + '</ol>' : '') + '</div>' +
      '</div></li>';
  }).join('') + '</ol>' +
'</div></section>' : '') +

'<section id="process" class="sec section-white"><div class="container">' +
  '<div class="eyebrow">PROCESS</div><h2 class="section-title">預約流程</h2>' +
  '<div class="process-grid n' + steps.length + '">' + steps.map(function (s, i) {
    return '<div class="step"><div class="step-dot' + (i % 2 === 0 ? ' done' : '') + '"></div><div class="step-label">STEP ' + String(i + 1).padStart(2, '0') + '</div><div class="step-title">' + esc(s.title) + '</div><div class="step-desc">' + esc(s.desc) + '</div></div>';
  }).join('') + '</div>' +
'</div></section>' +

((S.noteItems||[]).length ?
'<section id="rules" class="sec section-light"><div class="container">' +
  '<div class="eyebrow">RULES</div><h2 class="section-title">預約規則</h2>' +
  '<dl class="rules">' + S.noteItems.map(function (n) { return '<div class="rule"><dt>' + esc(n.title) + '</dt><dd>' + esc(n.desc) + '</dd></div>'; }).join('') + '</dl>' +
'</div></section>' : '') +

'<section id="faq" class="sec section-white"><div class="container">' +
  '<div class="eyebrow" style="text-align:center">FAQ</div><h2 class="section-title" style="text-align:center">常見問題</h2>' +
  '<div class="faq-list">' + (S.faqItems||[]).map(function (f, i) {
    return '<div class="faq-item"><button type="button" class="faq-q" aria-expanded="false" onclick="var o=this.parentElement.classList.toggle(\'open\');this.setAttribute(\'aria-expanded\',o)">' + esc(f.q) + '</button><div class="faq-a">' + esc(f.a) + '</div></div>';
  }).join('') + '</div>' +
'</div></section>' +

(LATEST_POSTS.length ?
'<section id="latest" class="sec section-light"><div class="container">' +

      (p.cat ? '<div class="post-cat">' + esc(p.cat) + '</div>' : '') + '<div class="post-title">' + esc(p.title) + '</div><div class="post-desc">' + esc(p.desc || '') + '</div></div></a>';
  }).join('') + '</div>' +

'</div></section>' : '') +

'<section class="sec cta section-dark"><div class="container">' +

'<footer class="footer"><div class="container">' + renderSocialLinks(S.socialLinks) +

// 手機底部固定預約列：捲過開場才出現，按 × 關掉後這次瀏覽不再出現
var stickyClosed_ = false;
function setupStickyCta_() {
  var bar = document.getElementById('stickyCta'), hero = document.querySelector('.hero');
  if (!bar || !hero) return;
  document.getElementById('stickyClose').onclick = function () { stickyClosed_ = true; bar.classList.remove('show'); };
  var upd = function () { if (!stickyClosed_) bar.classList.toggle('show', hero.getBoundingClientRect().bottom < 0); };
  if (!window.__stickyBound) { window.addEventListener('scroll', function () { var b = document.getElementById('stickyCta'), h = document.querySelector('.hero'); if (b && h && !stickyClosed_) b.classList.toggle('show', h.getBoundingClientRect().bottom < 0); }, { passive: true }); window.__stickyBound = true; }
  upd();
}

// 先用 SITE 預設值立即渲染（SEO + 快速顯示）；建置時已預先寫好內容的話（scripts/prerender-home.js），就先沿用，只接上互動功能
if (document.getElementById('app').children && document.getElementById('app').children.length) setupStickyCta_(); else renderSite(SITE);

// 背景載入試算表最新資料，有更新就重新渲染（不用重新部署 Netlify）
(function() {
  var apiBase = SITE.bookingFormUrl;
  if (!apiBase || apiBase === 'YOUR_APPS_SCRIPT_URL') return;
  var s = document.createElement('script');
  s.src = apiBase + '?page=siteConfig&callback=_siteConfigCb';
  window._siteConfigCb = function(data) {
    if (!data) return;
    var merged = {};
    for (var k in SITE) merged[k] = SITE[k];
    for (var k in data) if (data[k] !== '' && data[k] !== undefined) merged[k] = data[k];

    // 「關於我」三段文字（後台是拆成 aboutP1/aboutP2/aboutP3 三個欄位存的）
    if (data.aboutP1 || data.aboutP2 || data.aboutP3) {
      merged.aboutParagraphs = [data.aboutP1, data.aboutP2, data.aboutP3].filter(Boolean);
    }

    // 「我會做的事／不會做的事」（後台是 aboutDo1~4／aboutDont1~4 四個欄位存的，留空的那格不會出現在清單裡）
    var aboutDo = [data.aboutDo1, data.aboutDo2, data.aboutDo3, data.aboutDo4].filter(Boolean);
    if (aboutDo.length) merged.aboutDo = aboutDo;
    var aboutDont = [data.aboutDont1, data.aboutDont2, data.aboutDont3, data.aboutDont4].filter(Boolean);
    if (aboutDont.length) merged.aboutDont = aboutDont;

    // 我的諮詢風格（後台 style1~3 的 Title/Sub/Desc，標題留空代表這張不顯示）
    var styleItems = [];
    for (var si = 1; si <= 3; si++) {
      var st = data['style' + si + 'Title'];
      if (st) styleItems.push({ title: st, sub: data['style' + si + 'Sub'] || '', desc: data['style' + si + 'Desc'] || '' });
    }
    if (styleItems.length) merged.styleItems = styleItems;

    // Hero 資訊卡（後台開了 5 格 heroCard1Label/Value ~ heroCard5Label/Value，標籤跟內容都填了才算一格）
    var heroCards = [];
    for (var i = 1; i <= 5; i++) {
      var label = data['heroCard' + i + 'Label'], value = data['heroCard' + i + 'Value'];
      if (label && value) heroCards.push({ label: label, value: value });
    }
    if (heroCards.length) merged.heroInfoCard = heroCards;

    // 第一次諮詢怎麼進行（後台開了 6 格 first1When/Title/Desc ~ first6…，標題留空代表這格不使用）
    var firsts = [];
    for (var fi = 1; fi <= 6; fi++) {
      var ft = data['first' + fi + 'Title'];
      if (ft) firsts.push({ when: data['first' + fi + 'When'] || '', title: ft, desc: data['first' + fi + 'Desc'] || '' });
    }
    if (firsts.length) merged.firstSteps = firsts;

    // 預約流程（後台開了 6 格，標題留空代表這格不使用）
    var steps = [];
    for (var i = 1; i <= 6; i++) {
      var title = data['processStep' + i + 'Title'];
      if (title) steps.push({ title: title, desc: data['processStep' + i + 'Desc'] || '', done: data['processStep' + i + 'Done'] === true });
    }
    if (steps.length) merged.processSteps = steps;

    // 注意事項（後台開了 6 格，標題留空代表這格不使用）
    var notes = [];
    for (var i = 1; i <= 6; i++) {
      var title = data['note' + i + 'Title'];
      if (title) notes.push({ title: title, desc: data['note' + i + 'Desc'] || '' });
    }
    if (notes.length) merged.noteItems = notes;

    // 常見問題（後台開了 8 格，問題留空代表這格不使用）
    var faqs = [];
    for (var i = 1; i <= 8; i++) {
      var q = data['faq' + i + 'Q'];
      if (q) faqs.push({ q: q, a: data['faq' + i + 'A'] || '' });
    }
    if (faqs.length) merged.faqItems = faqs;

    // 社群連結（後台用 social_facebook／social_instagram... 這種攤平欄位存網址，key／label／color 還是用網頁預設的）
    merged.socialLinks = (SITE.socialLinks || []).map(function (s) {
      var url = data['social_' + s.key];
      return url ? Object.assign({}, s, { url: url }) : s;
    });

    renderSite(merged);
  };
  document.body.appendChild(s);
})();
</script>
