// ║  以下是自動渲染程式碼，不用動                                              ║
// ╚═══════════════════════════════════════════════════════════════════════════╝
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// 10 個社群平台的簡化圖示（單色線條/色塊，配合各平台官方色當底色）
var SOCIAL_ICONS = {
  facebook: '<path fill="#fff" d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>',
  instagram: '<rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="12" cy="12" r="4" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="17.3" cy="6.7" r="1.1" fill="#fff"/>',
  threads: '<text x="12" y="17" font-size="15" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-weight="700">@</text>',
  line: '<path fill="#fff" d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-4 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>',
  youtube: '<path fill="#fff" d="M9.5 7.5l8 4.5-8 4.5v-9z"/>',
  tiktok: '<path fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 18V6l9-1.5v9"/><circle cx="7" cy="18" r="2.3" fill="#fff"/><circle cx="16" cy="13" r="2.3" fill="#fff"/>',
  xiaohongshu: '<path fill="#fff" d="M6 3h12a1 1 0 0 1 1 1v16l-7-4-7 4V4a1 1 0 0 1 1-1z"/>',
  x: '<path stroke="#fff" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/>',
  telegram: '<path fill="#fff" d="M21 3L2 11l6 2 2 6 3-4 5 4z"/>',
  email: '<path fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M3.5 6h17v12h-17V6zm0 0l8.5 6.5L20.5 6"/>',
};

function renderSocialLinks(list) {
  var items = (list || []).filter(function(s) { return s.url && String(s.url).trim(); });
  if (!items.length) return '';
  return '<div class="social-links">' + items.map(function(s) {
    var href = s.key === 'email' ? ('mailto:' + s.url) : s.url;
    var icon = SOCIAL_ICONS[s.key] || '';
    return '<a href="' + esc(href) + '" target="_blank" rel="noopener" class="social-icon" style="background:' + s.color + '" title="' + esc(s.label) + '"><svg viewBox="0 0 24 24">' + icon + '</svg></a>';
  }).join('') + '</div>';
}

function renderSite(S) {
  document.title = S.siteTitle || '';
  try { document.querySelector('meta[name="description"]').content = S.siteDescription || ''; } catch(e){}
  try { document.querySelector('link[rel="canonical"]').href = S.siteUrl || ''; } catch(e){}
  var heroDesc = (S.heroDesc || '').replace(/\\n/g, '\n').replace(/\n/g, '<br>');
  var aboutParas = S.aboutParagraphs || [S.aboutP1, S.aboutP2, S.aboutP3].filter(Boolean);
  var aboutDo = S.aboutDo || [];
  var aboutDont = S.aboutDont || [];

  document.getElementById('app').innerHTML =
'<nav class="nav"><div class="nav-inner">' +
  '<div class="nav-brand">' + esc(S.brandName||'') + '<span style="color:var(--warm)">·</span>命理諮詢</div>' +
  '<div class="nav-links">' +
    '<a href="#about">關於我</a><a href="#service">服務內容</a><a href="#process">預約流程</a>' +
    '<a href="#notes">注意事項</a><a href="#faq">常見問題</a><a href="/blog/">命理文章</a>' +
  '</div>' +
  '<a href="#booking" class="nav-cta">立即預約諮詢 →</a>' +
'</div></nav>' +

'<section class="hero section-dark"><div class="container"><div class="hero-inner">' +
  '<div>' +
    (S.brandBadge ? '<div class="hero-badge">' + esc(S.brandBadge) + '</div>' : '') +
    '<h1>' + esc(S.brandTitle||'').replace('·','<span class="dot">·</span>') + '</h1>' +
    (S.brandTagline ? '<div class="hero-tagline">' + esc(S.brandTagline) + '</div>' : '') +
    '<p class="hero-desc">' + heroDesc + '</p>' +
    '<a href="#booking" class="btn-primary">立即預約諮詢 →</a>' +
  '</div>' +
  '<div class="hero-card">' +
    '<div class="hero-card-title">// 基本資訊</div>' +
    (S.heroInfoCard||[]).map(function(r){return '<div class="hero-card-row"><span class="hero-card-label">'+esc(r.label)+'</span><span class="hero-card-value">'+esc(r.value)+'</span></div>';}).join('') +
  '</div>' +
'</div></div></section>' +

'<section id="about" class="about section-light"><div class="container"><div class="about-inner">' +
  '<div class="about-photo-area">' +
    (S.aboutPhoto ? '<img src="'+S.aboutPhoto+'" class="about-photo" alt="'+esc(S.aboutName||'')+'" onerror="this.outerHTML=\'<div class=&quot;about-photo-placeholder&quot;>🐏</div>\'">' : '<div class="about-photo-placeholder">🐏</div>') +
    '<div class="about-name">' + esc(S.aboutName||'') + '</div>' +
    '<div class="about-role">' + esc(S.aboutRole||'') + '</div>' +
  '</div>' +
  '<div class="about-content">' +
    '<div class="eyebrow" style="color:var(--navy-3);">ABOUT</div>' +
    '<h3>' + esc(S.aboutTitle||'') + '</h3>' +
    aboutParas.map(function(p){return '<p>'+esc(p)+'</p>';}).join('') +
    (aboutDo.length||aboutDont.length ?
      '<div class="about-style-grid">' +
      (aboutDo.length ? '<div class="about-style-card do"><h4>我會做的事</h4><ul>'+aboutDo.map(function(i){return '<li>'+esc(i)+'</li>';}).join('')+'</ul></div>' : '') +
      (aboutDont.length ? '<div class="about-style-card dont"><h4>我不會做的事</h4><ul>'+aboutDont.map(function(i){return '<li>'+esc(i)+'</li>';}).join('')+'</ul></div>' : '') +
      '</div>' : '') +
  '</div>' +
'</div></div></section>' +

'<section id="service" class="service section-dark"><div class="container">' +
  '<div class="eyebrow">SERVICE</div><div class="section-title">諮詢服務</div>' +
  '<div class="service-card">' +
    '<div class="eyebrow" style="color:var(--warm);">' + esc(S.serviceLabel||'') + '</div>' +
    '<h3>' + esc(S.serviceTitle||'') + '</h3>' +
    '<p>' + esc(S.serviceDesc||'') + '</p>' +
    '<div class="service-meta">' +
      '<div><div class="service-price">' + esc(S.servicePrice||'') + '</div><div class="service-price-unit">' + esc(S.servicePriceUnit||'') + '</div></div>' +
      '<div class="service-detail">' + (S.serviceDetail||'') + '</div>' +
    '</div>' +
  '</div>' +
'</div></section>' +

'<section id="process" class="process section-white"><div class="container">' +
  '<div class="eyebrow" style="color:var(--navy-3);">PROCESS</div><div class="section-title">預約流程</div>' +
  '<div class="process-grid">' +
    (S.processSteps||[]).map(function(s,i,arr){return '<div class="process-step">'+
      '<div class="process-dot'+(s.done?'':' hollow')+'"></div>'+(i<arr.length-1?'<div class="process-line"></div>':'')+
      '<div class="process-label">STEP '+String(i+1).padStart(2,'0')+'</div>'+
      '<div class="process-title">'+esc(s.title)+'</div>'+
      '<div class="process-desc">'+esc(s.desc)+'</div></div>';}).join('') +
  '</div>' +
'</div></section>' +

'<section id="notes" class="notes section-light"><div class="container"><div class="notes-grid">' +
  '<div class="notes-left"><div class="eyebrow" style="color:var(--navy-3);">NOTES</div><div class="section-title">預約<br>注意事項</div></div>' +
  '<div class="notes-right">' +
    (S.noteItems||[]).map(function(n,i){return '<div class="note-item"><div class="note-item-label">N.'+String(i+1).padStart(2,'0')+'</div><div class="note-item-title">'+esc(n.title)+'</div><div class="note-item-desc">'+esc(n.desc)+'</div></div>';}).join('') +
  '</div>' +
'</div></div></section>' +

'<section id="faq" class="faq section-white"><div class="container">' +
  '<div class="eyebrow" style="text-align:center;color:var(--navy-3);">FAQ</div>' +
  '<div class="section-title" style="text-align:center;">常見問題</div>' +
  '<div class="faq-list">' +
    (S.faqItems||[]).map(function(f){return '<div class="faq-item"><div class="faq-q" onclick="this.parentElement.classList.toggle(\'open\')">'+esc(f.q)+'</div><div class="faq-a"><div class="faq-a-inner">'+esc(f.a)+'</div></div></div>';}).join('') +
  '</div>' +
'</div></section>' +

(S.bookingFormUrl && S.bookingFormUrl !== 'YOUR_APPS_SCRIPT_URL' ?
  '<section id="booking" class="booking-embed section-white"><div class="container">' +
    '<div class="eyebrow" style="color:var(--navy-3);">BOOKING</div>' +
    '<div class="section-title">線上預約</div>' +
    '<p class="booking-embed-subtitle">填寫出生資料並選擇方便的諮詢時段</p>' +
    '<div class="booking-iframe-wrap"><iframe src="'+S.bookingFormUrl+'" title="線上預約表單" loading="lazy"></iframe></div>' +
  '</div></section>' : '') +

'<section class="cta-section section-dark"><div class="container">' +
  '<div class="section-title">歡迎加入官方 LINE@ 諮詢</div>' +
  '<p>匯款完成後，記得私訊 LINE@ 告知訂單編號與匯款末五碼！</p>' +
  '<a href="'+(S.lineUrl||'')+'" target="_blank" rel="noopener" class="btn-warm">加入 LINE@ →</a>' +
'</div></section>' +

'<footer class="footer"><div class="container">' +
  renderSocialLinks(S.socialLinks) +
  '<p>' + (S.footerText||'') + '</p>' +
'</div></footer>';
}

// 先用 SITE 預設值立即渲染（SEO + 快速顯示）
renderSite(SITE);

// 背景載入試算表最新資料，有更新就重新渲染（不用重新部署 Netlify）
(function() {
  var apiBase = SITE.bookingFormUrl;
  if (!apiBase || apiBase === 'YOUR_APPS_SCRIPT_URL') return;
  var s = document.createElement('script');
  s.src = apiBase + '?page=siteConfig&callback=_siteConfigCb';
  window._siteConfigCb = function(data) {
    if (!data) return;
    var merged = {};
    for (var k in SITE) merged[k] = SITE[k];
    for (var k in data) if (data[k] !== '' && data[k] !== undefined) merged[k] = data[k];

    // 「關於我」三段文字（後台是拆成 aboutP1/aboutP2/aboutP3 三個欄位存的）
    if (data.aboutP1 || data.aboutP2 || data.aboutP3) {
      merged.aboutParagraphs = [data.aboutP1, data.aboutP2, data.aboutP3].filter(Boolean);
    }

    // 「我會做的事／不會做的事」（後台是 aboutDo1~4／aboutDont1~4 四個欄位存的，留空的那格不會出現在清單裡）
    var aboutDo = [data.aboutDo1, data.aboutDo2, data.aboutDo3, data.aboutDo4].filter(Boolean);
    if (aboutDo.length) merged.aboutDo = aboutDo;
    var aboutDont = [data.aboutDont1, data.aboutDont2, data.aboutDont3, data.aboutDont4].filter(Boolean);
    if (aboutDont.length) merged.aboutDont = aboutDont;

    // Hero 資訊卡（後台開了 5 格 heroCard1Label/Value ~ heroCard5Label/Value，標籤跟內容都填了才算一格）
    var heroCards = [];
    for (var i = 1; i <= 5; i++) {
      var label = data['heroCard' + i + 'Label'], value = data['heroCard' + i + 'Value'];
      if (label && value) heroCards.push({ label: label, value: value });
    }
    if (heroCards.length) merged.heroInfoCard = heroCards;

    // 預約流程（後台開了 6 格，標題留空代表這格不使用）
    var steps = [];
    for (var i = 1; i <= 6; i++) {
      var title = data['processStep' + i + 'Title'];
      if (title) steps.push({ title: title, desc: data['processStep' + i + 'Desc'] || '', done: data['processStep' + i + 'Done'] === true });
    }
    if (steps.length) merged.processSteps = steps;

    // 注意事項（後台開了 6 格，標題留空代表這格不使用）
    var notes = [];
    for (var i = 1; i <= 6; i++) {
      var title = data['note' + i + 'Title'];
      if (title) notes.push({ title: title, desc: data['note' + i + 'Desc'] || '' });
    }
    if (notes.length) merged.noteItems = notes;

    // 常見問題（後台開了 8 格，問題留空代表這格不使用）
    var faqs = [];
    for (var i = 1; i <= 8; i++) {
      var q = data['faq' + i + 'Q'];
      if (q) faqs.push({ q: q, a: data['faq' + i + 'A'] || '' });
    }
    if (faqs.length) merged.faqItems = faqs;

    // 社群連結（後台用 social_facebook／social_instagram... 這種攤平欄位存網址，key／label／color 還是用網頁預設的）
    merged.socialLinks = (SITE.socialLinks || []).map(function (s) {
      var url = data['social_' + s.key];
      return url ? Object.assign({}, s, { url: url }) : s;
    });

    renderSite(merged);
  };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
