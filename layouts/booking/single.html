{{ define "head" }}
<style>
.bk-page{padding:10px 0 0}
/* 預約頁：表單框塞滿畫面，只在表單裡捲（見 booking-bridge.js 的 dazhenFitFrame）；這頁不放頁尾，整頁不會再多一層捲動 */
.site-footer{display:none}
.bk-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bk-box{position:relative}
.bk-page .container{max-width:640px}
.bk-page h1{text-align:center;font-size:clamp(26px,5vw,32px);color:var(--navy);margin-bottom:10px}
.bk-page .bk-lead{text-align:center;color:#78716c;font-size:15px;line-height:1.8;margin-bottom:28px}
.bk-member{text-align:center;font-size:13px;line-height:1.6;color:#57534e;background:#fbf3ea;border:1px solid #eedcc6;border-radius:10px;padding:7px 12px;margin:0 auto 8px;max-width:520px}.bk-member a{color:var(--navy);font-weight:700}
.bk-load{position:absolute;left:0;right:0;top:0;bottom:0;background:var(--cream,#f5f3ef);text-align:center;padding:48px 16px 24px;color:#78716c;font-size:15px;line-height:1.8}.bk-load i{display:block;width:40px;height:40px;margin:0 auto 14px;border:4px solid #e7e5e4;border-top-color:#b8864b;border-radius:50%;animation:bkspin .9s linear infinite}@keyframes bkspin{to{transform:rotate(360deg)}}
.bk-frame{width:100%;height:calc(100vh - 120px);border:0;display:block;background:transparent}
@media (max-width:640px){.bk-page{padding:8px 0 0}.bk-page .container{padding:0 8px}}
</style>
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
{{ end }}
{{ define "main" }}
<div class="bk-page">
  <div class="container">
    <h1 class="bk-sr">{{ .Title }}</h1>
    {{/* 回頭客：會員中心可以「再預約一次」不用重填（不登入也能直接在下面預約） */}}
    <p class="bk-member">以前預約過嗎？到<a href="/member/">會員中心</a>用 LINE 或 Google 登入，按「再預約一次」就不用重填出生資料。</p>
    <div class="bk-box">
      <iframe class="bk-frame" id="bookingFrame" data-booking-frame title="線上預約表單"></iframe>
      <div class="bk-load" id="bkLoading" role="status"><i></i>預約表單載入中，請稍候…<br><small>第一次開啟會比較久，請不要離開頁面</small></div>
    </div>
  </div>
</div>
<script src="/booking-bridge.js?v=20261017"></script>
<script>window.dazhenFitFrame(document.getElementById('bookingFrame'));
// 表單網頁載完就拿掉「載入中」（原本要等表單回報高度才拿掉；預覽網址收不到回報，會一直蓋著）
document.getElementById('bookingFrame').addEventListener('load', function () { if (!this.src) return; setTimeout(function () { var l = document.getElementById('bkLoading'); if (l) l.remove(); }, 600); });</script>
<script>setTimeout(function () { var l = document.getElementById('bkLoading'); if (l) l.remove(); }, 40000);</script>
<script>
  // 在 LINE 裡開啟（LIFF）：先向 LINE 取得客人的身分憑證，帶給預約表單，送出後訂單自動綁定 LINE。
  // 不在 LINE 裡、或任何一步失敗，都直接載入一般表單（維持原本流程）。
  (function () {
    var frame = document.getElementById('bookingFrame'), base = window.dazhenBookingUrl({{ .Site.Params.bookingFormUrl }}), done = false;
    var liffId = {{ .Site.Params.liffBookingId | default "" }};
    function load(token) { if (done) return; done = true; frame.src = token ? base + '&lt=' + encodeURIComponent(token) : base; }
    var inLine = /Line\//i.test(navigator.userAgent) || /[?&]liff\.state=/.test(location.search);
    if (!inLine || !liffId) { load(''); return; }
    var timer = setTimeout(function () { load(''); }, 6000);
    var s = document.createElement('script');
    s.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
    s.onload = function () {
      liff.init({ liffId: liffId }).then(function () {
        if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }   // 帶原網址回來（專屬優惠連結的 ?code= 不會掉）
        clearTimeout(timer); load(liff.getIDToken() || '');
      }).catch(function () { clearTimeout(timer); load(''); });
    };
    s.onerror = function () { clearTimeout(timer); load(''); };
    document.head.appendChild(s);
  })();
</script>
{{ end }}
