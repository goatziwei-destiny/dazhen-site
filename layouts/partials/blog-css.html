<style>

.blog-card{display:flex;gap:18px;align-items:flex-start}

.side-topic summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;font-size:14px;color:#44403c}
