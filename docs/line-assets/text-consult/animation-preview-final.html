<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>紫微斗數文字諮詢｜開場動畫（直接淡入）</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0}
body{background:#0f1a17;color:#e9dfc4;font-family:"Noto Serif TC","Songti TC",serif;-webkit-font-smoothing:antialiased}
.stage{position:relative;height:100vh;height:100svh;overflow:hidden;background:#f4f1ea}
.intro{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(ellipse at 50% 45%,#1f3530 0%,#12201c 55%,#0a120f 100%)}
.bookwrap{position:relative;width:min(84vw,460px);aspect-ratio:1/1;border:0;background:none;padding:0;cursor:pointer;opacity:0;transform:scale(.92);transition:opacity .8s,transform .9s cubic-bezier(.2,.8,.2,1)}
.intro.go .bookwrap{opacity:1;transform:none}
.intro.opened .bookwrap{transform:scale(1.1);transition:transform 2s cubic-bezier(.3,.6,.2,1)}
.bookwrap>img{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .4s ease;filter:drop-shadow(0 14px 16px rgba(0,0,0,.45))}
.bookwrap>img.fast{transition-duration:.2s}
.bookwrap>img.on{opacity:1}
.ttl{margin-top:18px;text-align:center;opacity:0;transition:opacity .8s .8s}
.intro.go .ttl{opacity:1}.intro.opened .ttl{opacity:0;transition-delay:0s}
.ttl b{display:block;line-height:1.6;font-size:clamp(20px,6vw,28px);font-weight:900;letter-spacing:.3em;text-indent:.3em;color:#f1e7cc}
.ttl span{display:block;margin-top:8px;font-size:14px;letter-spacing:3px;color:#c9bf9f}
.skip,.replay{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;font:13px sans-serif;color:#e8e1cf;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:6px 14px;cursor:pointer;z-index:9}
.rise{position:absolute;inset:0;overflow:hidden;background:#f4f1ea;visibility:hidden;opacity:0;transition:opacity 1.9s ease,visibility 0s 1.9s}
.stage.under .rise{visibility:visible;opacity:1;transition:opacity 1.9s ease,visibility 0s}.stage.up .rise{overflow:auto}
.stage.up .intro{visibility:hidden}
.sheet{max-width:560px;margin:0 auto;box-shadow:0 0 30px rgba(0,0,0,.12)}
.sheet img{display:block;width:100%;height:auto}.sheet img+img{border-top:1px solid #e3ded0}
.note{max-width:560px;margin:0 auto;padding:14px 18px 40px;font:13px/1.7 sans-serif;color:#6b645a;text-align:center}
#curl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6;display:none}
.stage.curling #curl{display:block}.stage.up .skip{display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="stage" id="stage">
<section class="intro" id="intro">
  <button class="bookwrap" id="bk" type="button" aria-label="點一下翻開"><img alt="" class="on" src="animation-frames/closed.webp"><img alt="" src="animation-frames/half.webp"><img alt="" src="animation-frames/open.webp"><img alt="" class="fast" src="animation-frames/t1.webp"><img alt="" class="fast" src="animation-frames/t2.webp"><img alt="" class="fast" src="animation-frames/t3.webp"></button>
  <div class="ttl"><b>王小明<br>紫微斗數文字諮詢</b><span>點一下，翻開</span></div>
  <button class="skip" id="skip" type="button">略過</button>
</section>
<div class="rise" id="rise"><div class="sheet"><img src="design-samples/A3-V1-捲角紋-page1.png" alt="第一頁"><img src="design-samples/A3-V1-P2A-留白段落-page2-sealed-v2.png" alt="第二頁"></div>
<div class="note">預覽用：內頁是設計樣張的圖片；正式版會是可選取的文字、依內容長短往下捲。<br><button class="replay" id="replay" type="button" style="position:static;background:#1f4c44;color:#fff;margin-top:10px">重播開場</button></div></div>
<canvas id="curl"></canvas>
</div>
<script>
(function(){
var stage=document.getElementById('stage'),intro=document.getElementById('intro'),bk=document.getElementById('bk'),fr=bk.querySelectorAll('img'),timers=[],rise=document.getElementById('rise'),cv=document.getElementById('curl'),raf=0;
function show(list){for(var j=0;j<fr.length;j++)fr[j].classList.toggle('on',list.indexOf(j)>-1)}
var at=function(ms,fn){timers.push(setTimeout(fn,ms))};
function reset(){timers.forEach(clearTimeout);timers=[];cancelAnimationFrame(raf);stage.classList.remove('up','under');intro.classList.remove('go','opened');show([0]);rise.scrollTop=0;at(60,function(){intro.classList.add('go')})}
function done(){timers.forEach(clearTimeout);cancelAnimationFrame(raf);stage.classList.add('under','up')}
// 把「現在的畫面」畫進 scene（深色背景＋翻開的書），整張當成一頁紙
function snapshot(W,H,dpr){
  var s=document.createElement('canvas');s.width=W*dpr;s.height=H*dpr;var c=s.getContext('2d');c.scale(dpr,dpr);
  var g=c.createRadialGradient(W*.5,H*.45,0,W*.5,H*.45,Math.max(W,H)*.75);g.addColorStop(0,'#1f3530');g.addColorStop(.55,'#12201c');g.addColorStop(1,'#0a120f');c.fillStyle=g;c.fillRect(0,0,W,H);
  var r=fr[2].getBoundingClientRect(),st=stage.getBoundingClientRect();
  c.save();c.shadowColor='rgba(0,0,0,.45)';c.shadowBlur=18;c.shadowOffsetY=14;c.drawImage(fr[2],r.left-st.left,r.top-st.top,r.width,r.height);c.restore();
  return s;
}
function fadein(){stage.classList.add('under');at(2000,function(){stage.classList.add('up')})}
bk.onclick=function(){if(intro.classList.contains('opened'))return;intro.classList.add('opened');
 at(0,function(){show([1])});at(500,function(){show([2])});
 at(1250,function(){show([2,3])});at(1500,function(){show([2,4])});at(1760,function(){show([2,5])});at(2040,function(){show([2])});
 at(1350,fadein)};
document.getElementById('skip').onclick=done;document.getElementById('replay').onclick=reset;
reset();
})();
</script></body></html>
