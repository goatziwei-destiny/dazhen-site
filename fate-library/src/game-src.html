<title>命運書庫</title>
<style>
/* layout: one pixel-art game canvas (16:9 desktop, 9:16 phone) with link overlays, controls below; single dark look by design */
@font-face{font-family:"Cubic11";src:url(__FONT__) format("woff2");font-display:block}
:root{--night:#120f1e;--gold:#d4ad5f;--paper:#f3ead8;--muted:#a59fb6;--pixel:"Cubic11","Noto Sans TC","PingFang TC","Microsoft JhengHei",monospace;color-scheme:dark}
html,body{background:var(--night);color:var(--paper)}
body{font-family:var(--pixel);padding-block:20px;padding-inline:16px}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:12px}
header h1{font-size:1.2rem;margin:0;font-weight:400;letter-spacing:.05em}
header p{margin:.3rem 0 0;color:var(--muted);font-size:.85rem;line-height:1.6}
.stage{position:relative;aspect-ratio:16/9;width:100%;max-width:100%;overflow:hidden;background:var(--night);border:3px solid var(--gold);user-select:none;outline:none}
.stage.tall{aspect-ratio:9/16;max-width:480px;justify-self:center}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
.links a{position:absolute;display:block}
.links a:focus-visible{outline:3px solid var(--paper)}
.links a[hidden]{display:none}
.ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ctl button{font:inherit;font-size:.95rem;color:#120f1e;background:var(--gold);border:0;padding:.45rem 1rem;cursor:pointer;box-shadow:inset -3px -3px 0 rgba(0,0,0,.25)}
.ctl button.ghost{background:none;color:var(--gold);border:2px solid var(--gold);box-shadow:none}
.ctl button:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
body.capture{padding:0}
body.capture header,body.capture .ctl{display:none}
body.capture .wrap{max-width:none;display:block}
body.capture .stage{border:0;max-width:none}
</style>
<div class="wrap">
  <header><h1>命運書庫</h1><p>網站入口試做版。點畫面讓大正說下一句；選單、書和按鈕都能點，也可以用方向鍵和 Enter，Esc 返回。</p></header>
  <div class="stage" id="stage" tabindex="0">
    <canvas id="cv" width="1920" height="1080" aria-label="像素風的命運書庫：大正是住在書庫裡的羊，可以預約諮詢或挑選一本書閱讀"></canvas>
    <nav class="links" id="links" aria-label="連結"></nav>
  </div>
  <div class="ctl">
    <button id="replay" type="button">重看開場</button>
    <button id="snd" type="button" class="ghost" aria-pressed="false">音樂：關</button>
  </div>
</div>
<script>
(function(){
const SPR=__SPR__, FM=__FM__;
const SITE='https://dazhen-site.netlify.app';
const C={bg:'#120f1e',wood:'#4a3220',wood2:'#2a1c12',gold:'#d4ad5f',gold2:'#8a6a2a',paper:'#f3ead8',muted:'#a59fb6',panel:'#1b1830',panel2:'#262142',fire:'#f2c46b',teal:'#173d45',cream:'#f1e4c4',ink:'#2a2140'};
const FONT='"Cubic11","Noto Sans TC",monospace';
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const ez=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
let sd=11;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const stage=document.getElementById('stage'),links=document.getElementById('links');
const capture=/capture/.test(location.search),forceTall=/tall/.test(location.search);
let W=1920,H=1080,TALL=false,U=6,LY={};

// ================= 版面 =================
function layout(){
  TALL=forceTall||(!capture&&stage.parentElement.clientWidth<700);
  stage.classList.toggle('tall',TALL);
  W=TALL?1080:1920;H=TALL?1920:1080;cv.width=W;cv.height=H;
  if(capture){stage.style.width=W+'px';stage.style.height=H+'px';}
  LY=TALL?{gx:690,feet:1590,GH:700,dlg:{x:40,y:1610,w:1000,h:270},fs:48,
      panel:{x:50,y:110,w:980,h:760},ring:{x:540,y:450,rx:400,ry:235,cw:100},book:{x:330,y:720,s:.7},plq:{x:540,y:120}}
    :{gx:1560,feet:1020,GH:780,dlg:{x:70,y:800,w:1220,h:240},fs:52,
      panel:{x:90,y:90,w:1000,h:680},ring:{x:700,y:380,rx:520,ry:240,cw:108},book:{x:640,y:560,s:.82},plq:{x:640,y:80}};
  buildBg();buildShelf();
}

// ================= 素材 =================
const IM={};
function sprite(n,x,y,w,h){const im=IM[n];if(im)ctx.drawImage(im,x,y,w,h);}

// ================= 書庫背景 =================
function glow(cx,cy,r0,steps,step,alpha,col){if(!(alpha>0))return;ctx.fillStyle=col;for(let k=steps;k>=1;k--){const R=(r0+k*step)/U;ctx.globalAlpha=alpha;for(let j=-Math.ceil(R);j<=Math.ceil(R);j++){const hw=Math.floor(Math.sqrt(Math.max(0,R*R-j*j)));ctx.fillRect(Math.round(cx/U)*U-hw*U,Math.round(cy/U)*U+j*U,hw*2*U+U,U);}}ctx.globalAlpha=1;}
function soft(x,y,r,a,col){if(!(a>0))return;const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col.replace('A',a));g.addColorStop(.45,col.replace('A',a*.45));g.addColorStop(1,col.replace('A',0));ctx.fillStyle=g;ctx.fillRect(x-r,y-r,2*r,2*r);}
const WARM='rgba(255,214,140,A)';
let motes=[];
function buildBg(){sd=11;motes=[...Array(TALL?18:26)].map(()=>({x:rnd()*W,y:rnd()*H,p:rnd()*6.28,s:.3+rnd()*.5,k:[2,5,6,9][Math.floor(rnd()*4)]}));}
const CANDLES={w:[[1880,672],[597,356],[1384,356]],t:[[1047,1040],[347,780],[733,780]]};
function bg(t){const tm=inTemple(),cu=closeUp();ctx.imageSmoothingEnabled=true;sprite(cu?(TALL?'cbgt':'cbgw'):tm?(TALL?'tbgt':'tbgw'):(TALL?'bgt':'bgw'),0,0,W,H);ctx.imageSmoothingEnabled=false;
  for(const [x,y] of (cu?[]:tm?tp().candles:CANDLES[TALL?'t':'w'])){const f=.07+.03*Math.sin(t*7+x)+.015*Math.sin(t*13+y);glow(x,y,8,3,10,f,C.fire);}
  for(const d of motes){const y=(d.y-t*18*d.s+H*10)%H,x=d.x+Math.sin(t*d.s+d.p)*24;const a=.25+.35*Math.max(0,Math.sin(t*1.8+d.p));const m=FM['fx'+d.k];if(!m)continue;const sz=TALL?.14:.12;ctx.globalAlpha=a;ctx.imageSmoothingEnabled=true;sprite('fx'+d.k,x-m.w*sz/2,y-m.h*sz/2,m.w*sz,m.h*sz);}
  ctx.globalAlpha=1;ctx.imageSmoothingEnabled=false;}
// ================= 羊 =================
function goatBox(fr){const m=FM[fr];const s=LY.GH/m.sh;return {s,x:G.x-m.hx*s,y:LY.feet-m.h*s,w:m.w*s,h:m.h*s};}
function drawGoat(fr,a){const m=FM[fr];if(!m)return;const b=goatBox(fr);const br=G.walking?0:Math.round(Math.sin(T*2.1)*1.5)*2;
  ctx.globalAlpha=.4*a;ctx.fillStyle='#000';for(let i=-16;i<=16;i++){const hw=Math.round(Math.sqrt(1-(i/16)**2)*3);ctx.fillRect(G.x+i*U,LY.feet-U*hw,U,U*Math.max(1,hw));}
  ctx.globalAlpha=a;ctx.imageSmoothingEnabled=false;sprite(fr,b.x,b.y-br,b.w,b.h+br);ctx.globalAlpha=1;return b;}

// ================= 書 / 卡 =================
const PAL=['命','兄弟','夫妻','子女','財帛','疾厄','遷移','交友','官祿','田宅','福德','父母'];
function cardBack(cx,cy,w,sx,a){const h=w*1.5;ctx.save();ctx.globalAlpha=a;ctx.translate(cx,cy);ctx.scale(sx,1);ctx.imageSmoothingEnabled=true;sprite('cardg',-w/2,-h/2,w,h);ctx.imageSmoothingEnabled=false;ctx.restore();ctx.globalAlpha=1;}
const ICON=[0,1,2,3,6,4,5,7,8,9,11,10];
function cardFront(cx,cy,w,sx,i,a,showLabel){const h=w*1.5;ctx.save();ctx.globalAlpha=a;ctx.translate(cx,cy);ctx.scale(sx,1);ctx.imageSmoothingEnabled=true;
  sprite('front',-w/2,-h/2,w,h);const k='ic'+ICON[i],m=FM[k];const bw=w*.56,sc=Math.min(bw/m.w,bw/m.h);sprite(k,-m.w*sc/2,-m.h*sc/2,m.w*sc,m.h*sc);ctx.imageSmoothingEnabled=false;ctx.restore();
  if(showLabel&&Math.abs(sx)>.6){const fs=Math.round(w*.24);ctx.font=`${fs}px ${FONT}`;ctx.textAlign='center';ctx.lineWidth=6;ctx.strokeStyle=C.bg;ctx.strokeText(PAL[i],cx,cy+h/2+fs*1.15);ctx.fillStyle=C.paper;ctx.fillText(PAL[i],cx,cy+h/2+fs*1.15);}
  ctx.globalAlpha=1;}
const CARDS={mode:'none',t0:0,src:{x:0,y:0}};
function ringPos(i,t){const R=LY.ring;const ang=-Math.PI/2+i*Math.PI*2/12+t*.12;return {x:R.x+Math.cos(ang)*R.rx,y:R.y+Math.sin(ang)*R.ry+Math.sin(T*1.4+i)*8,depth:(Math.sin(ang)+1)/2};}
function drawCards(){if(CARDS.mode==='none')return;const t=T-CARDS.t0,cw=LY.ring.cw;const list=[];
  for(let i=0;i<12;i++){let p,k=1,sx=1,front=false,a=1;const rp=ringPos(i,T);
    if(CARDS.mode==='out'){const t0=i*.13;k=eo(prog(t,t0,t0+1));if(k<=0)continue;p={x:CARDS.src.x+(rp.x-CARDS.src.x)*k,y:CARDS.src.y+(rp.y-CARDS.src.y)*k-Math.sin(Math.PI*k)*160,depth:rp.depth};sx=k<1?Math.cos(k*Math.PI*4):1;}
    else if(CARDS.mode==='ring'){p=rp;}
    else if(CARDS.mode==='flip'){p=rp;const f=prog(t,i*.18,i*.18+.4);sx=Math.cos(f*Math.PI);front=f>.5;if(front)sx=-sx;}
    else if(CARDS.mode==='front'){p=rp;front=true;}
    else if(CARDS.mode==='back'){const t0=(11-i)*.08;k=1-eo(prog(t,t0,t0+.8));p={x:CARDS.src.x+(rp.x-CARDS.src.x)*k,y:CARDS.src.y+(rp.y-CARDS.src.y)*k,depth:rp.depth};front=false;a=k>.05?1:0;}
    const s=(.7+.4*p.depth)*(CARDS.mode==='out'||CARDS.mode==='back'?(.4+.6*k):1);list.push({p,s,sx,front,a,i});}
  list.sort((a,b)=>a.p.depth-b.p.depth).forEach(c=>{if(!c.a)return;const w=cw*c.s;const sx=Math.abs(c.sx)<.08?.08*Math.sign(c.sx||1):c.sx;
    glow(c.p.x,c.p.y,w*.35,2,w*.2,.05,C.fire);c.front?cardFront(c.p.x,c.p.y,w,sx,c.i,.8+.2*c.p.depth,CARDS.mode==='front'||CARDS.mode==='flip'):cardBack(c.p.x,c.p.y,w,sx,.8+.2*c.p.depth);});}
const BOOKF={mode:'none',t0:0};
// ================= 書架上的書（全部同一款，只換顏色） =================
const CAST_T=3.8;
function castT(){const b=beat();return (ST.scene==='intro'&&b&&b.fx==='cast')?ST.bt:-1;}
function fxSprite(k,x,y,sz,a,rot){const m=FM['fx'+k];if(!m)return;ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);if(rot)ctx.rotate(rot);ctx.imageSmoothingEnabled=true;sprite('fx'+k,-m.w*sz/2,-m.h*sz/2,m.w*sz,m.h*sz);ctx.restore();ctx.globalAlpha=1;ctx.imageSmoothingEnabled=false;}
const SHELF={
 w:{bw:36,bh:115,fh:100,rows:[[101,1576,1920],[266,1576,1920],[439,1576,1920],[597,1576,1920],[749,1576,1838]],chosen:[1,6],c:{x:760,y:330,rx:440,ry:150}},
 t:{bw:31,bh:98,fh:86,rows:[[90,0,235],[218,0,235],[339,0,235],[459,0,235],[582,0,235],[90,849,1080],[218,849,1080],[339,849,1080],[459,849,1080],[582,849,1080],[712,849,1080],[849,849,1080]],chosen:[3,4],c:{x:540,y:560,rx:390,ry:170}}};
let BOOKS2=[],FLY=[],CHOSEN=null;
function buildShelf(){const L=SHELF[TALL?'t':'w'];BOOKS2=[];let r=7;const rn=()=>{r=(r*16807)%2147483647;return r/2147483647;};
  L.rows.forEach(([y,x0,x1],ri)=>{let x=x0+2+Math.floor(rn()*4);let k=0;while(x+L.bw<=x1){BOOKS2.push({x:x+L.bw/2,y,c:Math.floor(rn()*4),row:ri,k,hide:false});x+=L.bw+(rn()<.25?2+Math.floor(rn()*5):1);k++;}});
  const [cr,ck]=L.chosen;CHOSEN=BOOKS2.find(b=>b.row===cr&&b.k===ck)||BOOKS2[0];CHOSEN.c=0;
  FLY=BOOKS2.filter((b,i)=>b!==CHOSEN&&i%9===4);FLY.forEach((b,i)=>b.fi=i);}
function orbitP(ang){const C=SHELF[TALL?'t':'w'].c;return {x:C.x+Math.cos(ang)*C.rx,y:C.y+Math.sin(ang)*C.ry,d:(Math.sin(ang)+1)/2};}
function bookHome(b){const L=SHELF[TALL?'t':'w'];return {x:b.x,y:b.y-L.bh/2};}
function castDone(){if(ST.scene!=='intro')return false;const ci=S.intro.findIndex(q=>q.fx==='cast');return ST.bi>ci;}
function drawShelfBooks(){const L=SHELF[TALL?'t':'w'],t=castT();ctx.imageSmoothingEnabled=true;
  for(const b of BOOKS2){if(b===CHOSEN&&(castDone()||t>=.1))continue;
    if(t>=0&&b.fi!==undefined){const d=b.fi*.035;if(t>=.1+d&&t<3.15+d)continue;}
    sprite('sc'+b.c,b.x-L.bw/2,b.y-L.bh,L.bw,L.bh);}
  ctx.imageSmoothingEnabled=false;}
function flyBook(c,fr,x,y,h,a,rot){const k='fc'+c+'_'+fr,m=FM[k];if(!m||a<=0)return;const sc=h/FM['fc'+c+'_0'].h;ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);if(rot)ctx.rotate(rot);ctx.imageSmoothingEnabled=true;sprite(k,-m.w*sc/2,-m.h*sc/2,m.w*sc,m.h*sc);ctx.restore();ctx.globalAlpha=1;ctx.imageSmoothingEnabled=false;}
function spineAt(c,x,y,sc,a){const L=SHELF[TALL?'t':'w'];ctx.globalAlpha=a;ctx.imageSmoothingEnabled=true;sprite('sc'+c,x-L.bw*sc/2,y-L.bh*sc/2,L.bw*sc,L.bh*sc);ctx.imageSmoothingEnabled=false;ctx.globalAlpha=1;}
function flapFr(ph){return [0,1,2,3][Math.floor(ph)%4];}
// 其他書：飛出、繞圈、飛回原位
function drawFlock(){const t=castT();if(t<0)return;const L=SHELF[TALL?'t':'w'];const n=FLY.length;const list=[];
  FLY.forEach((b,i)=>{b.fi=i;const d=i*.035,H=bookHome(b);const ang=-Math.PI/2+(i+1)/(n+1)*Math.PI*2+t*1.4,o=orbitP(ang);
    const pull=prog(t,.1+d,.4+d),kOut=ez(prog(t,.4+d,1.3+d)),kBack=ez(prog(t,2.3+d,3.0+d)),land=prog(t,3.0+d,3.15+d);
    if(t<.1+d||t>=3.15+d)return;
    if(pull<1){list.push({z:-1,f:()=>{spineAt(b.c,H.x,H.y-pull*8,1+.25*pull,1);soft(H.x,H.y,50,.25*pull,WARM);}});return;}
    if(kBack>=1){list.push({z:-1,f:()=>spineAt(b.c,H.x,H.y-(1-land)*8,1+.25*(1-land),1)});return;}
    const k=kOut*(1-kBack);const x=H.x+(o.x-H.x)*k,y=H.y+(o.y-H.y)*k-Math.sin(Math.PI*k)*60;
    const fr=(k<.25)?0:flapFr(T*9+i*1.3);const h=L.fh*(.8+.25*k*(.75+.5*o.d));const dim=1-.3*prog(t,1.8,2.3)*(1-kBack);
    list.push({z:o.d*k,f:()=>{flyBook(b.c,fr,x,y,h,dim,Math.sin(T*2+i)*.15*k);if(t<.55+d)fxSprite(5,x,y,.4,1-prog(t,.4+d,.55+d),0);}});});
  list.sort((a,b)=>a.z-b.z).forEach(q=>q.f());}
function handPos(){const bb=goatBox('book0');return {x:bb.x+bb.w*.275,y:bb.y+bb.h*.40};}
function handSz(){return .30*LY.GH/780;}
function handH(){return 150*LY.GH/780;}
// 被選中的那本：飛到大正手上
function bookFly(){const t=castT();if(t<.1)return;const L=SHELF[TALL?'t':'w'],H=bookHome(CHOSEN),hp=handPos(),hh=handH();
  const pull=prog(t,.1,.5);if(pull<1){soft(H.x,H.y,70,.4*pull,WARM);spineAt(0,H.x,H.y-pull*10,1+.3*pull,1);return;}
  const ang=-Math.PI/2+t*1.4,o=orbitP(ang);const kA=ez(prog(t,.5,1.4)),kC=ez(prog(t,2.5,3.6));
  let x=H.x+(o.x-H.x)*kA,y=H.y+(o.y-H.y)*kA,h=L.fh*(.8+.4*kA);const pick=eo(prog(t,1.8,2.4));
  const ox=x,oy=y,path=q=>({x:ox+(hp.x-ox)*q,y:oy+(hp.y-oy)*q-Math.sin(Math.PI*q)*120});
  if(kC>0){const pp=path(kC);x=pp.x;y=pp.y;h=h+(hh-h)*kC;}
  soft(x,y,90+90*pick,.18+.4*pick*(1-kC*.6),WARM);
  if(kC>0&&kC<1)for(let i=1;i<7;i++){const pp=path(Math.max(0,kC-i*.05));fxSprite([5,6,2][i%3],pp.x,pp.y,.32,(1-i/7)*.8,0);}
  if(pick>0&&kC<1){for(let i=0;i<6;i++){const ph=(T*.7+i/6)%1,r=50+40*ph;fxSprite([2,5,6][i%3],x+Math.cos(i*1.05+T)*r,y+Math.sin(i*1.05+T)*r*.8,.3,pick*(1-ph)*(1-kC),0);}}
  if(t<.65)fxSprite(5,x,y,.5,1-prog(t,.5,.65),0);
  const fr=(kA<.25||kC>.7)?0:flapFr(T*(kC>0?6:8));flyBook(0,fr,x,y,h,1,kC>.7?-.12*(kC-.7)/.3:Math.sin(T*2)*.1);}
// 空中的命運之書 + 魔法陣
const FB={mode:'none',t0:0};
function airPos(){return {x:LY.ring.x,y:LY.ring.y};}
function drawAirBook(late){if(FB.mode==='none')return;if((FB.mode==='up'||FB.mode==='down')!==!!late)return;const t=T-FB.t0,h=handPos(),A=airPos();let x=A.x,y=A.y+Math.sin(T*1.6)*8,fr='bk2',sz=TALL?.42:.46;
  if(FB.mode==='up'){const k=ez(prog(t,0,1.2)),hs=handSz();x=h.x+(A.x-h.x)*k;y=h.y+(A.y-h.y)*k-Math.sin(Math.PI*k)*60;fr='bk0';sz=hs+(sz-hs)*k;}
  if(FB.mode==='open'){fr=t<.35?'bk0':(t<.7?'bk1':'bk2');}
  if(FB.mode==='close'){fr=t<.3?'bk2':(t<.6?'bk1':'bk0');}
  if(FB.mode==='down'){const k=ez(prog(t,0,1.1)),hs=handSz();x=A.x+(h.x-A.x)*k;y=A.y+(h.y-A.y)*k-Math.sin(Math.PI*k)*90;fr='bk0';sz=sz+(hs-sz)*k;}
  const m=FM[fr];soft(x,y,180,.3,WARM);ctx.imageSmoothingEnabled=true;sprite(fr,x-m.w*sz/2,y-m.h*sz/2,m.w*sz,m.h*sz);ctx.imageSmoothingEnabled=false;}
const MC={on:false,t0:0,off:0};
function drawCircle(){if(!MC.on&&!MC.off)return;const t=T-MC.t0;let a=eo(prog(t,0,.9));if(MC.off){a*=1-prog(T,MC.off,MC.off+.8);if(T>MC.off+.8){MC.off=0;MC.on=false;return;}}
  const A=airPos(),cx=A.x,cy=A.y+(TALL?300:285),m=FM.mc,d=(TALL?600:640)*(.5+.5*eo(prog(t,0,1)));
  // 光柱：上寬下窄，由魔法陣中心往上擴散
  const top=A.y-(TALL?170:160),bw=d*.1,tw=d*.62;
  const g=ctx.createLinearGradient(0,cy,0,top);g.addColorStop(0,`rgba(255,214,140,${.32*a})`);g.addColorStop(.6,`rgba(255,214,140,${.12*a})`);g.addColorStop(1,'rgba(255,214,140,0)');ctx.fillStyle=g;
  ctx.beginPath();ctx.moveTo(cx-bw,cy);ctx.lineTo(cx+bw,cy);ctx.lineTo(cx+tw/2,top);ctx.lineTo(cx-tw/2,top);ctx.closePath();ctx.fill();
  ctx.save();ctx.translate(cx,cy);ctx.scale(1,.26);ctx.rotate(T*.35);ctx.globalAlpha=a*.95;ctx.imageSmoothingEnabled=true;sprite('mc',-d/2,-d/2,d,d);ctx.restore();ctx.globalAlpha=1;ctx.imageSmoothingEnabled=false;
  soft(cx,cy,d*.5,.18*a,WARM);}
let FLASH=0;
function retT(){if(!TITLE[ST.scene])return -1;if(ST.leave)return T-ST.leave.t0;const b=beat();return (b&&b.fx==='end')?ST.bt:-1;}
function floatBook(a,title,sub){const B=LY.book,h=handPos(),hs=handSz();let x=B.x,y=B.y+Math.sin(T*1.3)*10,fr='bk2',s=B.s;
  if(ST.bi===0&&!ST.leave&&ST.bt<1.1){const k=ez(prog(ST.bt,.1,.8));x=h.x+(x-h.x)*k;y=h.y+(y-h.y)*k-Math.sin(Math.PI*k)*90;s=hs+(s-hs)*k;fr=k<.85?'bk0':(ST.bt<.95?'bk1':'bk2');}
  const rt=retT();let back=0;if(rt>=0){fr=rt<.25?'bk2':(rt<.5?'bk1':'bk0');back=ez(prog(rt,.5,1.4));x=x+(h.x-x)*back;y=y+(h.y-y)*back-Math.sin(Math.PI*back)*80;s=s+(hs-s)*back;}
  if(back>=1){if(title)plaque(LY.plq.x,LY.plq.y,title,sub,a);return;}
  const m=FM[fr];soft(x,y-40,(TALL?260:300)*(1-back*.6)*(fr==='bk2'?1:.6),.35*(1-back),WARM);
  ctx.imageSmoothingEnabled=true;sprite(fr,x-m.w*s/2,y-m.h*s/2,m.w*s,m.h*s);ctx.imageSmoothingEnabled=false;
  if(fr==='bk2'){const P=[2,5,6,4,2,5,9,6,3,2];for(let i=0;i<P.length;i++){const ph=(T*.16+i/P.length)%1;const px=x+Math.sin(i*2.1)*(60+90*ph)+Math.sin(T*.9+i)*10,py=y-60-ph*(TALL?220:200);
    const tw=.6+.4*Math.sin(T*4+i*1.7);fxSprite(P[i],px,py,P[i]>=3?.11:.3,tw*Math.min(1,ph*4)*(1-ph),0);}}

function parchBox(x,y,w,h){ctx.fillStyle='#4a2f1c';ctx.fillRect(x+U,y,w-2*U,h);ctx.fillRect(x,y+U,w,h-2*U);ctx.fillStyle='#f3e4c2';ctx.fillRect(x+U,y+U,w-2*U,h-2*U);
  ctx.fillStyle=C.gold;ctx.fillRect(x+3*U,y+3*U,w-6*U,2);ctx.fillRect(x+3*U,y+h-3*U-2,w-6*U,2);ctx.fillRect(x+3*U,y+3*U,2,h-6*U);ctx.fillRect(x+w-3*U-2,y+3*U,2,h-6*U);
  for(const [a,b,dx,dy] of [[x+5*U,y+5*U,1,1],[x+w-5*U,y+5*U,-1,1],[x+5*U,y+h-5*U,1,-1],[x+w-5*U,y+h-5*U,-1,-1]]){ctx.fillRect(a,b,dx*4*U,2);ctx.fillRect(a,b,2,dy*4*U);ctx.fillRect(a+dx*U*1.5,b+dy*U*1.5,U,U);}}
function tealBox(x,y,w,h){ctx.fillStyle='#10201f';ctx.fillRect(x,y,w,h);ctx.fillStyle='#1f403e';ctx.fillRect(x+U,y+U,w-2*U,h-2*U);ctx.fillStyle=C.gold;ctx.fillRect(x+2*U,y+2*U,w-4*U,2);ctx.fillRect(x+2*U,y+h-2*U-2,w-4*U,2);ctx.fillRect(x+2*U,y+2*U,2,h-4*U);ctx.fillRect(x+w-2*U-2,y+2*U,2,h-4*U);}
function scrollBox(x,y,w,h){const c=22;const path=(i)=>{ctx.beginPath();ctx.moveTo(x+c+i,y+i);ctx.lineTo(x+w-c-i,y+i);ctx.lineTo(x+w-i,y+c+i);ctx.lineTo(x+w-i,y+h-c-i);ctx.lineTo(x+w-c-i,y+h-i);ctx.lineTo(x+c+i,y+h-i);ctx.lineTo(x+i,y+h-c-i);ctx.lineTo(x+i,y+c+i);ctx.closePath();};
  ctx.save();ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=18;ctx.shadowOffsetY=6;path(0);ctx.fillStyle='#b98a3e';ctx.fill();ctx.restore();
  path(4);const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,'#fbf1dc');g.addColorStop(1,'#f1e0bd');ctx.fillStyle=g;ctx.fill();
  path(12);ctx.strokeStyle='#c9a057';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#c9a057';for(const [cx,cy,dx,dy] of [[x+18,y+18,1,1],[x+w-18,y+18,-1,1],[x+18,y+h-18,1,-1],[x+w-18,y+h-18,-1,-1]]){ctx.fillRect(cx+dx*6-2,cy+dy*6-2,4,4);ctx.fillRect(cx+dx*14,cy+dy*4,dx*16,2);ctx.fillRect(cx+dx*4,cy+dy*14,2,dy*16);}
  const mx=x+w/2;ctx.fillRect(mx-30,y+h-12,60,2);ctx.fillRect(mx-3,y+h-16,6,6);}

function frameBox(x,y,w,h,fill){ctx.fillStyle=fill||C.panel;ctx.fillRect(x,y,w,h);ctx.fillStyle=C.gold;ctx.fillRect(x,y,w,U);ctx.fillRect(x,y+h-U,w,U);ctx.fillRect(x,y,U,h);ctx.fillRect(x+w-U,y,U,h);
  ctx.fillStyle=C.gold2;ctx.fillRect(x+2*U,y+2*U,w-4*U,2);ctx.fillRect(x+2*U,y+h-2*U-2,w-4*U,2);ctx.fillRect(x+2*U,y+2*U,2,h-4*U);ctx.fillRect(x+w-2*U-2,y+2*U,2,h-4*U);
  ctx.fillStyle=C.bg;[[x,y],[x+w-U,y],[x,y+h-U],[x+w-U,y+h-U]].forEach(([a,b])=>ctx.fillRect(a,b,U,U));}
function text(s,x,y,size,col,align){ctx.font=`${size}px ${FONT}`;ctx.fillStyle=col;ctx.textAlign=align||'left';ctx.textBaseline='alphabetic';ctx.fillText(s,x,y);}
function wrap(str,x,y,maxw,size,col){ctx.font=`${size}px ${FONT}`;let line='',yy=y;for(const ch of str){if(ctx.measureText(line+ch).width>maxw){text(line,x,yy,size,col);line=ch;yy+=size*1.5;}else line+=ch;}text(line,x,yy,size,col);}
function plaque(cx,y,title,sub,a){ctx.globalAlpha=a;ctx.font=`56px ${FONT}`;const w=Math.max(ctx.measureText(title).width,sub?ctx.measureText(sub).width*.6:0)+120;const h=sub?150:100;
  frameBox(cx-w/2,y-10,w,h,C.panel2);text(title,cx,y+62,56,C.gold,'center');if(sub)text(sub,cx,y+118,34,C.paper,'center');ctx.globalAlpha=1;}
function coin(x,y,r){for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++){const d=i*i+j*j;if(d<=r*r){ctx.fillStyle=d>(r-1.2)*(r-1.2)?'#a07a2c':(i<-1&&j<-1&&d<(r*.6)**2?'#fbe7a8':'#e3b84f');ctx.fillRect(x+i*U,y+j*U,U,U);}}ctx.fillStyle='#a07a2c';ctx.fillRect(x-U,y-U*3,U*2,U*6);}

  ctx.fillStyle=primary?(on?'#e8c473':C.gold):(on?C.panel2:C.panel);ctx.fillRect(x,y,w,h);ctx.fillStyle=primary?C.gold2:C.gold;ctx.fillRect(x,y+h-U,w,U);
  if(!primary){ctx.fillRect(x,y,w,U);ctx.fillRect(x,y,U,h);ctx.fillRect(x+w-U,y,U,h);}text(label,x+w/2,y+60,44,primary?'#1a1408':(on?C.paper:C.muted),'center');}
function pill(id,label,x,y){ctx.font=`34px ${FONT}`;const w=ctx.measureText(label).width+50;const on=SEL===id;regions.push({x,y,w,h:60,id});

document.getElementById('replay').addEventListener('click',()=>{INTRO_T0=T;FLASH=0;ST.next=null;ST.fade=0;enter('intro');stage.focus();});

// ================= 啟動 =================
function step(dt){update(dt);while(SFXQ.length){const k=SFXQ.shift();if(!capture)sfx(k);}if(blips.length>lastB){lastB=blips.length;if(!capture)blip();}render();}
let last=0;function loop(now){step(Math.min(.1,(now-last)/1000));last=now;requestAnimationFrame(loop);}
let seen=false;try{seen=localStorage.getItem('dz_seen')==='1';localStorage.setItem('dz_seen','1');}catch(e){}
const loads=Object.entries(SPR).map(([k,src])=>new Promise(r=>{const im=new Image();im.onload=()=>{IM[k]=im;r();};im.onerror=r;im.src=src;}));
const fontReady=document.fonts?Promise.race([document.fonts.load(`44px "Cubic11"`,'命運書庫'),new Promise(r=>setTimeout(r,2500))]):Promise.resolve();
if(capture)document.body.classList.add('capture');
layout();window.addEventListener('resize',()=>{const was=TALL;layout();if(was!==TALL){G.x=LY.gx;}});
Promise.all([fontReady,...loads]).then(()=>{{const hs=(location.hash||'').slice(1);enter(DUO_GAME?'duo':(TSC[hs]||hs==='tgo'?hs:(seen&&!capture?'back':'intro')));}if(DUO_GAME){const r=document.getElementById('replay');if(r)r.style.display='none';const hd=document.querySelector('header');if(hd)hd.style.display='none';}
  if(capture){window.__step=n=>{for(let i=0;i<n;i++)step(1/30);};window.__act=act;window.__sel=v=>{SEL=v;};window.__poke=()=>userPoke();window.__regions=()=>regions.map(r=>[r.id,Math.round(r.x),Math.round(r.y),Math.round(r.w),Math.round(r.h)]);window.__state=()=>({scene:ST.scene,bi:ST.bi});window.__ready=true;render();}
  else{last=performance.now();requestAnimationFrame(loop);}});
})();
