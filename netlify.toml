[build]
  publish = "public"
  command = "hugo && node scripts/prerender-home.js"

[build.environment]
  HUGO_VERSION = "0.147.6"

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

# 自架字體：允許預約表單（Apps Script）跨網域使用，並長期快取
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"

# 顧客好評頁隱藏期間，舊網址自動導回首頁（頁面公開後這條會自動失效，不用刪）
[[redirects]]
  from = "/testimonials/*"
  to = "/"
  status = 302

# 原本的 LINE 轉導頁已刪除；以前寄出的確認信裡還有這個網址，導到 LINE 官方帳號的加好友頁，客人不會看到 404
[[redirects]]
  from = "/line-redirect/*"
  to = "https://line.me/R/ti/p/%40159cibme"
  status = 302

# 2026-10-11 文章分類改成「主題」（/topics/），舊的分類網址導到文章列表
[[redirects]]
  from = "/categories/*"
  to = "/topics/"
  status = 301

# 命運書庫網站版（/library/）：圖片檔名含內容雜湊，內容變了檔名就會變，所以可以讓手機長期快取（再次打開幾乎不用重新下載）
[[headers]]
  for = "/library/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/library/*.mp3"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
