[build]
  publish = "public"
  command = "hugo"

[build.environment]
  HUGO_VERSION = "0.147.6"

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

# 自架字體：允許預約表單（Apps Script）跨網域使用，並長期快取
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"

# 顧客好評頁隱藏期間，舊網址自動導回首頁（頁面公開後這條會自動失效，不用刪）
[[redirects]]
  from = "/testimonials/*"
  to = "/"
  status = 302

# 命運書庫網站版（/library/）：圖片檔名含內容雜湊，內容變了檔名就會變，所以可以讓手機長期快取（再次打開幾乎不用重新下載）
[[headers]]
  for = "/library/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/library/*.mp3"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
