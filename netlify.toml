[build]
  publish = "public"
  command = "hugo"

[build.environment]
  HUGO_VERSION = "0.147.6"

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

# 自架字體：允許預約表單（Apps Script）跨網域使用，並長期快取
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"
