[build]
  publish = "public"
  command = "hugo"

[build.environment]
  HUGO_VERSION = "0.147.6"

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

# 自架字體：允許預約表單（Apps Script）跨網域使用，並長期快取
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"

# 顧客好評頁隱藏期間，舊網址自動導回首頁（頁面公開後這條會自動失效，不用刪）
[[redirects]]
  from = "/testimonials/*"
  to = "/"
  status = 302

# 原本的 LINE 轉導頁已刪除；以前寄出的確認信裡還有這個網址，導到 LINE 官方帳號的加好友頁，客人不會看到 404
[[redirects]]
  from = "/line-redirect/*"
  to = "https://line.me/R/ti/p/%40159cibme"
  status = 302
