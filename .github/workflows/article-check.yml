# 文章 PR 自動檢查（2026-10-28）：有改到 content/blog 的 PR，照寫作規範跑 scripts/check-articles.js。
# ✗ 錯誤會顯示紅叉（不能上線）；△ 提醒只列在記錄裡，給 GPT／Claude 審文參考。
name: 文章檢查
on:
  pull_request:
    paths: ["content/blog/**", "static/images/**", "scripts/check-articles.js"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: 照寫作規範檢查
        run: node scripts/check-articles.js --changed origin/${{ github.base_ref }} | tee check.txt
      - name: 寫進摘要
        if: always()
        run: { echo '## 文章檢查'; echo '```'; cat check.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
