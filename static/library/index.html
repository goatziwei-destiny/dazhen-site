:root{--night:#120f1e;--gold:#d4ad5f;--paper:#f3ead8;--muted:#a59fb6;--pixel:"Cubic11","Noto Sans TC","PingFang TC","Microsoft JhengHei",monospace;color-scheme:dark}
html,body{background:var(--night);color:var(--paper)}
body{font-family:var(--pixel);padding-block:20px;padding-inline:16px}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:12px}
header h1{font-size:1.2rem;margin:0;font-weight:400;letter-spacing:.05em}
header p{margin:.3rem 0 0;color:var(--muted);font-size:.85rem;line-height:1.6}
.stage{position:relative;aspect-ratio:16/9;width:100%;max-width:100%;overflow:hidden;background:var(--night);border:3px solid var(--gold);user-select:none;outline:none}
.stage.tall{aspect-ratio:9/16;max-width:480px;justify-self:center}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
.links a{position:absolute;display:block}
.links a:focus-visible{outline:3px solid var(--paper)}
.links a[hidden]{display:none}
.ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ctl button{font:inherit;font-size:.95rem;color:#120f1e;background:var(--gold);border:0;padding:.45rem 1rem;cursor:pointer;box-shadow:inset -3px -3px 0 rgba(0,0,0,.25)}
.ctl button.ghost{background:none;color:var(--gold);border:2px solid var(--gold);box-shadow:none}
.ctl button:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
body.capture{padding:0}
body.capture header,body.capture .ctl{display:none}
body.capture .wrap{max-width:none;display:block}
body.capture .stage{border:0;max-width:none}

  if(closeUp()&&ST.bi===0){const B=IDBOX();const n=Math.min(beatText(b).length,Math.floor(ST.bt*CPS+1e-4));wrap(beatText(b).slice(0,n).join(''),B.x+50,B.y+70,B.w-100,TALL?40:42,'#3a2616');return;}
  dlgBox(D);
  const n=Math.min(beatText(b).length,Math.floor(ST.bt*cpsOf(b)+1e-4));wrap(beatText(b).slice(0,n).join(''),D.x+60,D.y+(TALL?95:92),D.w-120,LY.fs,dlgCol());
  if(ST.bt>=typeDur(b)&&!b.stay&&Math.floor(T*2.5)%2===0){ctx.fillStyle=C.gold;const ax=D.x+D.w-70,ay=D.y+D.h-56;for(let i=0;i<4;i++)ctx.fillRect(ax+i*U,ay+i*U,(8-2*i)*U,U);}}

// ================= 繪製 =================
function render(){regions=[];ctx.imageSmoothingEnabled=false;bg(T);const b=beat();
  const isBook=TITLE[ST.scene];
  if(!inTemple()&&!closeUp())drawShelfBooks();drawFlock();drawDoor();drawTempleBack();drawCircle();drawAirBook();drawCards();
  let gb;if(closeUp()){duoScene(b);gb=null;}else{const kn=kneelInfo(b);if(kn){if(kn.k<1)drawGoat('present1',1-kn.k);drawKneel(kn.fr,kn.k);gb=null;}else gb=drawGoat(poseFrame(b),goatAlpha());}if(!inTemple())drawZzz();drawTempleFront();drawTF();drawTG();
  if(gb&&b&&b.stay&&!inTemple()&&ST.scene!=='intro'&&PZ.i<0&&IDLE.st==='none')regions.push({x:gb.x+gb.w*.15,y:gb.y,w:gb.w*.7,h:gb.h,id:'dazheng'});
  if(b&&b.fx==='dcast'&&!closeUp())drawDraw(0);
  drawDuo();duoHint();
  if(isBook){sceneBook();bookDiagram();}
  drawAirBook(true);bookFly();
  if(FLASH&&T>=FLASH&&T-FLASH<.5){const k=1-(T-FLASH)/.5;const hp=handPos();glow(hp.x,hp.y,40,4,40*(1.5-k),.25*k,C.fire);ctx.globalAlpha=.35*k;ctx.fillStyle='#fff6d8';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  if(ST.scene==='menu')sceneMenu();if(ST.scene==='booking')sceneBooking();if(ST.scene==='shelf')sceneShelf();if(ST.scene==='draw')sceneDraw();if(ST.scene==='duo')sceneDuo();if(ST.scene==='palace')scenePalace();if(ST.scene==='temple')sceneTemple();sceneTopicEnd();
  palaceZoom();
  dialog();
  if(ST.scene==='intro')pill('skip','跳過 ▶▶',W-250,40);
  if(b&&b.say&&!b.stay)regions.unshift({x:0,y:0,w:W,h:H,id:'__adv'});
  const f=ST.next?prog(ST.fade,0,.35):(ST.fade<0?-ST.fade/.35:0);const fi=ST.scene==='intro'?1-prog(T-INTRO_T0,0,.8):0;const fa=Math.max(f,fi);
  if(fa>0){ctx.globalAlpha=fa;ctx.fillStyle='#07050c';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  syncLinks();}

// ================= 互動 =================
function act(id){IDLE.last=T;if(ST.next||ST.leave)return;
  if(id==='dazheng'){let k;do{k=Math.floor(Math.random()*POKE.length);}while(k===pokeLast);pokeLast=k;quip(POKE[k][0],POKE[k][1]);if(!capture)sfx('pop');return;}
  if(id==='__adv'){advance();return;}
  if(id==='skip'){go('menu');return;}
  if(id.startsWith('dk:')){duoPick(+id.slice(3));return;}
  if(id==='duogo'){if(ST.scene==='duo'&&ST.bi===0){ST.bi=1;startBeat();}return;}
  if(id==='reduo'){DRAW.again=true;go('duo');return;}
  if(id==='redraw'){DRAW.again=true;go('draw');return;}
  if(id==='palback'){if(PZ.i>=0&&!PZ.back){PZ.back=T;S.palace[0]={say:'還想看哪一宮呢？',pose:'talk',stay:1};ST.bt=0;ST.typed=0;}return;}
  if(id.startsWith('pal:')){const i=+id.slice(4);if(PZ.i>=0)return;PZ.i=i;PZ.t0=T;PZ.back=0;PSEL=i;S.palace[0]={say:(i===0?'命宮':PAL[i]+'宮')+'：'+PDESC[i],pose:i%2?'present:1':'talk',stay:1};ST.bt=0;ST.typed=0;return;}
  if(id==='tpage'){TPAGE=1-TPAGE;SEL=null;return;}
  if(id==='tgo'||TSC[id]){go(id);return;}
  if(id==='menu'||id==='booking'||id==='shelf'||id==='draw'||id==='palace'||id==='duo'){if(TITLE[ST.scene]){const b=beat();if(!(b&&b.fx==='end'&&ST.bt>=1.4)){ST.leave={to:id,t0:T};return;}}go(id);return;}
  if(TITLE[id]){go(id);return;}}
const pool=[];
function syncLinks(){const hs=regions.filter(r=>r.href&&!ST.next);while(pool.length<hs.length){const a=document.createElement('a');a.target='_top';
    a.addEventListener('mouseenter',()=>{SEL=a.dataset.id;});a.addEventListener('focus',()=>{SEL=a.dataset.id;});a.addEventListener('click',e=>e.stopPropagation());links.appendChild(a);pool.push(a);}
  pool.forEach((a,i)=>{const r=hs[i];if(!r){a.hidden=true;return;}a.hidden=false;a.href=r.href;a.dataset.id=r.id;a.setAttribute('aria-label','前往預約');
    Object.assign(a.style,{left:(r.x/W*100)+'%',top:(r.y/H*100)+'%',width:(r.w/W*100)+'%',height:(r.h/H*100)+'%'});});}
function hit(e){const b=stage.getBoundingClientRect();const x=(e.clientX-b.left)/b.width*W,y=(e.clientY-b.top)/b.height*H;
  for(let i=regions.length-1;i>=0;i--){const r=regions[i];if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h)return r;}return null;}
stage.addEventListener('mousemove',e=>{if(IDLE.st==='sit'){userPoke();return;}IDLE.last=T;const r=hit(e);SEL=r&&r.id!=='__adv'?r.id:(regions.some(q=>q.id===SEL&&q.id!=='__adv')&&e.buttons?SEL:null);stage.style.cursor=r?'pointer':'default';});
stage.addEventListener('click',e=>{const woke=userPoke();if(!music&&!started){started=true;setMusic(true);}const r=hit(e);if(woke&&(!r||r.id==='dazheng'||r.id==='__adv'))return;if(r&&!r.href)act(r.id);});
stage.addEventListener('keydown',e=>{if(userPoke()){e.preventDefault();return;}const ids=regions.filter(r=>r.id!=='__adv').map(r=>r.id);
  if(e.key==='Escape'&&ST.scene==='palace'&&PZ.i>=0){act('palback');return;}
  if(e.key==='Escape'&&inTemple()&&ST.scene!=='temple'){act('temple');return;}
  if(e.key==='Escape'){act(ST.scene==='menu'?'__none':(TITLE[ST.scene]?'shelf':'menu'));return;}
  if((e.key==='Enter'||e.key===' ')&&regions.some(r=>r.id==='__adv')&&!SEL){advance();e.preventDefault();return;}
  if(!ids.length)return;let i=ids.indexOf(SEL);
  if(['ArrowDown','ArrowRight'].includes(e.key)){SEL=ids[(i+1)%ids.length];e.preventDefault();}
  if(['ArrowUp','ArrowLeft'].includes(e.key)){SEL=ids[(i-1+ids.length)%ids.length];e.preventDefault();}
  if(e.key==='Enter'&&SEL){const r=regions.find(r=>r.id===SEL);if(r&&r.href){const a=pool.find(a=>a.dataset.id===r.id);a&&a.click();}else if(r)act(r.id);e.preventDefault();}});

// ================= 聲音 =================
const au=new Audio();au.preload='none';au.src='loop.4922fefb.mp3';au.loop=true;au.volume=.6;let music=false,started=false;const sndB=document.getElementById('snd');
function setMusic(v){music=v;sndB.textContent=music?'音樂：開':'音樂：關';sndB.setAttribute('aria-pressed',music);try{music?au.play().catch(()=>{}):au.pause();}catch(e){}}
sndB.addEventListener('click',()=>{started=true;setMusic(!music);});
const DSFX_CU=[[.9,'shuf'],[1.4,'shuf'],[1.9,'shuf'],[2.3,'whoosh'],[3.7,'whoosh'],[4.9,'pop']];
const SFXQ=[],DSFX=[[.7,'whoosh'],[1.7,'shuf'],[2.2,'shuf'],[2.7,'shuf'],[3.2,'shuf'],[4.6,'ding'],[5.3,'whoosh'],[6.6,'pop']];
function sfx(k){if(!music)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const n=AC.currentTime;
  if(k==='whoosh'||k==='shuf'){const d=k==='whoosh'?.5:.18,len=Math.floor(AC.sampleRate*d),buf=AC.createBuffer(1,len,AC.sampleRate),ch=buf.getChannelData(0);for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/len);
    const src=AC.createBufferSource();src.buffer=buf;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.setValueAtTime(k==='whoosh'?600:2200,n);f.frequency.linearRampToValueAtTime(k==='whoosh'?2400:3200,n+d);const g=AC.createGain();g.gain.value=k==='whoosh'?.12:.06;src.connect(f).connect(g).connect(AC.destination);src.start();}
  else{const fs=k==='ding'?[1318,1976]:[880];fs.forEach((fq,j)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=fq;g.gain.setValueAtTime(0,n+j*.08);g.gain.linearRampToValueAtTime(.06,n+j*.08+.01);g.gain.exponentialRampToValueAtTime(.001,n+j*.08+(k==='ding'?.8:.2));o.connect(g).connect(AC.destination);o.start(n+j*.08);o.stop(n+j*.08+.9);});}}catch(e){}}
let AC=null,lastB=0;function blip(){if(!music)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=600+Math.random()*60;g.gain.setValueAtTime(.03,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.05);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+.06);}catch(e){}}
document.getElementById('replay').addEventListener('click',()=>{INTRO_T0=T;FLASH=0;ST.next=null;ST.fade=0;enter('intro');stage.focus();});

// ================= 啟動 =================
function step(dt){update(dt);while(SFXQ.length){const k=SFXQ.shift();if(!capture)sfx(k);}if(blips.length>lastB){lastB=blips.length;if(!capture)blip();}render();if(WAIT&&T-WAIT.t0>.2)loadingMark();}
function loadingMark(){const w=TALL?300:280,h=72,x=W-w-30,y=H-h-30;ctx.globalAlpha=.92;frameBox(x,y,w,h);const n=Math.floor(T*3)%4;text('載入中'+'．'.repeat(n),x+w/2,y+h/2+14,TALL?36:34,C.paper,'center');ctx.globalAlpha=1;}
let last=0;function loop(now){step(Math.min(.1,(now-last)/1000));last=now;requestAnimationFrame(loop);}
let seen=false;try{seen=localStorage.getItem('dz_seen')==='1';localStorage.setItem('dz_seen','1');}catch(e){}
const loads=LAZY?(layout(),[need(GRP.core)]):Object.entries(SPR).map(([k,src])=>new Promise(r=>{const im=new Image();im.onload=()=>{IM[k]=im;r();};im.onerror=r;im.src=src;}));
const fontReady=document.fonts?Promise.race([document.fonts.load(`44px "Cubic11"`,'命運書庫'),new Promise(r=>setTimeout(r,2500))]):Promise.resolve();
if(capture)document.body.classList.add('capture');
layout();window.addEventListener('resize',()=>{const was=TALL;layout();if(was!==TALL){G.x=LY.gx;if(LAZY){need(GRP.core);need(groupKeys(ST.scene));}}});
Promise.all([fontReady,...loads]).then(()=>{{const hs=(location.hash||'').slice(1);enter(DUO_GAME?'duo':(TSC[hs]||hs==='tgo'?hs:(seen&&!capture?'back':'intro')));}if(DUO_GAME){const r=document.getElementById('replay');if(r)r.style.display='none';const hd=document.querySelector('header');if(hd)hd.style.display='none';}
  if(capture){window.__step=n=>{for(let i=0;i<n;i++)step(1/30);};window.__act=act;window.__sel=v=>{SEL=v;};window.__poke=()=>userPoke();window.__regions=()=>regions.map(r=>[r.id,Math.round(r.x),Math.round(r.y),Math.round(r.w),Math.round(r.h)]);window.__state=()=>({scene:ST.scene,bi:ST.bi});window.__ready=true;render();}
  else{last=performance.now();requestAnimationFrame(loop);}});
})();
