<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>紫微斗數文字諮詢｜大正命理諮詢</title>
<!-- 大正 11/18：文字諮詢閱讀頁改成網站自己畫。書和開場在這裡立刻出現，回覆內容在背景向預約系統拿（page=replyData，檢查跟以前一樣）。
     樣式與內頁照預約系統 src/Mingshu.html（tools/gen-reply-page.py 產生，改 Mingshu.html 後要重跑）。 -->
<link rel="preload" as="image" href="/images/mingshu/book2-closed.webp">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600;900&display=swap">
<style>
:root{--teal:#1b4d44;--teal-l:#3d6b61;--ink:#2e2a24;--ink-2:#6a6256;--paper:#f6f2ea;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}
body{background:#0f1a17;color:var(--ink);font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;-webkit-font-smoothing:antialiased}
.stage{position:relative;height:100vh;height:100svh;overflow:hidden;background:var(--paper)}
.intro{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(ellipse at 50% 45%,#1f3530 0%,#12201c 55%,#0a120f 100%)}
.bookwrap{position:relative;width:min(84vw,460px);aspect-ratio:1/1;border:0;background:none;padding:0;cursor:pointer;opacity:0;transform:scale(.92);transition:opacity .8s,transform .9s cubic-bezier(.2,.8,.2,1)}
.intro.go .bookwrap{opacity:1;transform:none}
.intro.opened .bookwrap{transform:scale(1.1);transition:transform 2s cubic-bezier(.3,.6,.2,1)}
.bookwrap>img{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .4s ease;filter:drop-shadow(0 14px 16px rgba(0,0,0,.45))}
.bookwrap>img.fast{transition-duration:.2s}
.bookwrap>img.on{opacity:1}
.ttl{margin-top:18px;text-align:center;opacity:0;transition:opacity .8s .8s}
.intro.go .ttl{opacity:1}.intro.opened .ttl{opacity:0;transition-delay:0s}
.ttl b{display:block;line-height:1.6;font-size:clamp(20px,6vw,28px);font-weight:900;letter-spacing:.3em;text-indent:.3em;color:#f1e7cc}
.ttl span{display:block;margin-top:8px;font-size:14px;letter-spacing:3px;color:#c9bf9f}
.skip{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;font:13px sans-serif;color:#e8e1cf;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:6px 14px;cursor:pointer;z-index:3}
/* 翻頁的時候，文字版內容直接淡入（大正 11/8 定稿）：書本不淡出、不滑動 */
.rise{position:absolute;inset:0;overflow:hidden;background:var(--paper);visibility:hidden;opacity:0;transition:opacity 1.9s ease,visibility 0s 1.9s}
.stage.under .rise{visibility:visible;opacity:1;transition:opacity 1.9s ease,visibility 0s}
.stage.up .intro{visibility:hidden}
.stage.done{height:auto;overflow:visible}.stage.done .intro{display:none}.stage.done .rise{position:relative;inset:auto;height:auto;overflow:visible;visibility:visible;opacity:1;transition:none}
.book{background:var(--paper) url("/images/mingshu/paper2.webp") center top/100% auto repeat-y;min-height:100vh;position:relative}
.page{font-weight:300;letter-spacing:.04em;max-width:560px;margin:0 auto;padding:16px 24px 110px;position:relative;overflow-wrap:anywhere;word-break:break-word}
.run{font-size:12px;letter-spacing:2px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.head{display:block;width:100%;max-width:420px;margin:22px auto 6px}
h1{text-align:center;font-size:clamp(24px,7.2vw,44px);font-weight:900;letter-spacing:.3em;text-indent:.3em;white-space:nowrap;margin:14px 0 14px;color:var(--teal)}
.who{text-align:center;font-size:15px;letter-spacing:3px;color:var(--ink-2)}
.dv{display:block;height:26px;margin:18px auto 26px;width:min(100%,300px);background:url("/images/mingshu/divstar.webp") center/contain no-repeat}
.dv.small{margin:34px auto 38px}
.voice{display:flex;gap:12px;align-items:center;padding:20px 22px;margin:0 0 26px;background:#e8ede0;border-radius:22px 30px 24px 32px / 26px 20px 30px 22px;box-shadow:0 0 12px 6px #e8ede0}
.voice .av{width:50px;height:50px;border-radius:50%;flex:none;background:#fff8e8 url("/images/avatar-goat.webp") center/cover;box-shadow:0 0 0 2px #b8862b}
.voice .t{flex:1;min-width:0}.voice .t b{display:block;font-size:15.5px;color:var(--teal)}.voice .t span{font-family:sans-serif;font-size:12px;color:var(--ink-2)}
.voice audio{width:100%;margin-top:8px;height:36px}
.greet{font-size:17px;line-height:2;margin:0 0 14px}
.ch-h{display:flex;align-items:center;gap:14px;margin:6px 0 16px}
.ch-n{width:58px;height:58px;flex:none;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:var(--teal);background:url("/images/mingshu/ring.webp") center/contain no-repeat}
.ch-t{flex:1;min-width:0;font-size:12px;letter-spacing:4px;color:var(--ink-2);padding-bottom:10px;background:url("/images/mingshu/line-long.webp") left bottom/100% 4px no-repeat}
.ch-t b{display:block;font-family:"Noto Serif TC","Songti TC",serif;font-size:20px;letter-spacing:1px;color:var(--teal);margin-top:2px}
.q{position:relative;margin:4px 0 20px;padding:4px 10px 2px 16px;border-style:solid;border-width:22px 26px 22px 28px;border-image:url("/images/mingshu/qwash.webp") 60 90 fill / 22px 26px 22px 28px stretch;font-size:15.5px;line-height:1.9;color:#4d3a22;white-space:pre-wrap}
.q::before{content:"問";position:absolute;left:-30px;top:-27px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:#f7e6d6;background:url("/images/mingshu/qseal.webp") center/contain no-repeat}
/* 客人的問題太長：超過約 7 行先摺起來、下面淡出；整塊橘色都能點，點一下展開、再點收起 */
.q .qt{display:block}.q.fold .qt{max-height:11.4em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.q.tog{cursor:pointer;-webkit-tap-highlight-color:transparent}.q.tog:focus-visible{outline:2px solid var(--teal-l);outline-offset:2px}
.qmore{display:block;margin:-10px 0 22px auto;font:600 14px sans-serif;color:var(--teal);background:rgba(255,252,246,.8);border:1px solid rgba(27,77,68,.3);border-radius:999px;cursor:pointer;padding:5px 14px}
@media print{.q.fold .qt{max-height:none;-webkit-mask-image:none;mask-image:none}.qmore{display:none!important}}
.ch p{font-size:17px;line-height:2;margin:0 0 14px}
.ch .q+p,.ch .qmore+p{font-weight:600;color:var(--teal)}
.ch-n,.ch-t b,.sign b{font-weight:700}h1{font-weight:900}
.keys{list-style:none;margin:0;padding:0}
.keys li{padding:8px 0 14px;font-size:16.5px;line-height:1.95}
.keys li b{color:var(--teal);font-weight:700}
.take{margin:6px 8px 0;padding:22px 20px 14px;background:#e8ede0;border-radius:22px 30px 24px 32px / 26px 20px 30px 22px;box-shadow:0 0 12px 8px #e8ede0;font-size:17px;line-height:1.95;color:var(--ink)}
.take p{margin:0 0 10px}.take p:last-child{margin:0}
.sign{display:flex;justify-content:flex-end;margin:44px 30px 60px 0}
.sign .tx{position:relative;text-align:right;font-size:14px;color:var(--ink-2);line-height:2}.sign .tx b{display:block;font-size:18px;color:var(--ink);letter-spacing:4px}
.sign .dt{display:block;letter-spacing:2px}
.sign .tx b,.sign .dt{position:relative;z-index:1;text-shadow:0 0 2px var(--paper),0 0 4px var(--paper)}
.seal{position:absolute;right:-40px;top:6px;width:86px;height:auto;transform:rotate(-6deg);mix-blend-mode:multiply;opacity:.78;pointer-events:none;z-index:0}
.acts{display:grid;gap:10px;font-family:sans-serif}
.acts a,.acts button{display:block;text-align:center;font:inherit;font-weight:700;font-size:15px;text-decoration:none;padding:13px;border-radius:999px;cursor:pointer}
.acts .s{background:rgba(255,255,255,.6);color:var(--teal);border:1px solid rgba(27,77,68,.35)}
.fine{font-family:sans-serif;font-size:13px;color:var(--ink-2);text-align:center;line-height:1.8;margin-top:22px}
.hint{font-family:sans-serif;font-size:13px;color:var(--ink-2);text-align:center;margin:4px 0 0}
.msg{text-align:center;padding-top:30px}.msg p{font-size:16px;line-height:2}
@media print{body{background:#fff}.stage,.stage.done{height:auto;overflow:visible;background:none}.intro,.acts,.fine,.hint,.skip,.voice audio{display:none!important}.rise{position:static;height:auto;opacity:1;visibility:visible}.book{background:#fff}.page{padding-bottom:20px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.ttl span.wait{opacity:.75}
.ld{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:60vh;font:15px/1.8 sans-serif;color:var(--ink-2)}
.ld i{width:30px;height:30px;border:3px solid #d9d2c3;border-top-color:var(--teal);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.retry{margin-top:6px;font:600 15px sans-serif;color:var(--teal);background:rgba(255,255,255,.7);border:1px solid rgba(27,77,68,.35);border-radius:999px;padding:10px 22px;cursor:pointer}
</style>
</head>
<body>
<div class="stage" id="stage">
<section class="intro" id="intro" aria-label="打開你的紫微斗數文字諮詢">
  <button class="bookwrap" id="bk" type="button" aria-label="點一下翻開你的紫微斗數文字諮詢"><img alt="" class="on" src="/images/mingshu/book2-closed.webp"><img alt="" src="/images/mingshu/book2-half.webp"><img alt="" src="/images/mingshu/book2-open.webp"><img alt="" class="fast" src="/images/mingshu/book2-t1.webp"><img alt="" class="fast" src="/images/mingshu/book2-t2.webp"><img alt="" class="fast" src="/images/mingshu/book2-t3.webp"></button>
  <div class="ttl"><b id="ttlName">紫微斗數文字諮詢</b><span id="ttlHint">點一下，翻開</span></div>
  <button class="skip" id="skip" type="button">略過</button>
</section>
<div class="rise">
<main class="book" id="book"><div class="page" id="page"><div class="ld"><i></i>文字諮詢載入中，請稍候…</div></div></main>
</div></div>
<script src="/js/dz-api.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search), b = q.get('b') || '', t = q.get('t') || '', k = q.get('k') || '';
  var stage = document.getElementById('stage'), intro = document.getElementById('intro'), bk = document.getElementById('bk'), fr = bk.querySelectorAll(':scope > img'), page = document.getElementById('page');
  var hint = document.getElementById('ttlHint'), timers = [], data = null, wantOpen = false, key = '';
  var show = function (list) { for (var j = 0; j < fr.length; j++) fr[j].classList.toggle('on', list.indexOf(j) > -1); };
  var at = function (ms, fn) { timers.push(setTimeout(fn, ms)); };
  var done = function () { stage.classList.add('under', 'up', 'done'); try { if (key) localStorage.setItem(key, '1'); } catch (e) { } };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var msg = function (title, text, retry) {
    page.innerHTML = '<img class="head" alt="" src="/images/mingshu/emblem2.webp"><div class="msg"><h1 style="font-size:30px;letter-spacing:6px;text-indent:6px">' + title + '</h1><p>' + text + '</p>' + (retry ? '<button class="retry" type="button" id="retry">再試一次</button>' : '') + '</div>';
    if (retry) document.getElementById('retry').onclick = function () { location.reload(); };
    timers.forEach(clearTimeout); key = ''; done();
  };
  var play = function () {
    if (intro.classList.contains('opened')) return; intro.classList.add('opened');
    at(0, function () { show([1]); }); at(500, function () { show([2]); });
    at(1250, function () { show([2, 3]); }); at(1500, function () { show([2, 4]); }); at(1760, function () { show([2, 5]); }); at(2040, function () { show([2]); });
    at(1350, function () { stage.classList.add('under'); at(2000, done); });   // 翻頁的同時，內容直接淡入
  };
  if (!/^GRW?\d{8}-\d{2}$/.test(b) || !/^[0-9a-f]{32}$/.test(k || t)) { msg('這個連結打不開', '連結可能不完整。請回到 LINE、Email 或會員中心，重新按一次「打開你的紫微斗數文字諮詢」。<br>還是打不開的話，直接在 LINE 跟大正說一聲。'); return; }
  var seen = false; try { seen = localStorage.getItem('ms-seen-' + b) === '1'; } catch (e) { }
  if (seen) done();   // 看過的：不再播開場，內容拿到就直接顯示
  else {
    at(60, function () { intro.classList.add('go'); });
    bk.onclick = function () { if (data) play(); else { wantOpen = true; hint.textContent = '內容準備中，馬上好…'; hint.classList.add('wait'); } };
    document.getElementById('skip').onclick = function () { timers.forEach(clearTimeout); done(); };
  }
  var params = { b: b }; if (k) params.k = k; else params.t = t;
  DZ_API.jsonp('replyData', params, 45000).then(function (d) {
    if (!d || !d.ok || typeof d.body !== 'string') { msg('目前無法開啟內容', '請稍後再試一次。還是打不開的話，直接在 LINE 跟大正說一聲。', true); return; }
    data = d; document.title = d.pageTitle || document.title;
    page.innerHTML = d.body;   // 預約系統產生、已跳脫的內頁
    afterBody();
    if (!d.intro) { timers.forEach(clearTimeout); done(); return; }   // 連結不對、已取消、已刪除、還在寫：直接顯示說明
    key = d.seenKey || '';
    if (d.name) document.getElementById('ttlName').innerHTML = esc(d.name) + '<br>紫微斗數文字諮詢';
    if (wantOpen) play(); else if (hint.classList.contains('wait')) { hint.textContent = '點一下，翻開'; hint.classList.remove('wait'); }
  }).catch(function () { msg('網路有點慢', '文字諮詢沒有載入成功，請按下面的按鈕再試一次。', true); });

  function afterBody() {
  // 問題太長就先摺起來（量的是實際高度，手機、電腦都準）
  var qs = document.querySelectorAll('.q');
  for (var i = 0; i < qs.length; i++) (function (q) {
    var t = q.querySelector('.qt'); if (!t) return;
    var lh = parseFloat(getComputedStyle(t).lineHeight) || 29;
    if (t.scrollHeight <= lh * 7.5) return;   // 7 行以內照登
    q.classList.add('fold', 'tog'); q.setAttribute('role', 'button'); q.tabIndex = 0; q.setAttribute('aria-expanded', 'false');
    var b = document.createElement('button'); b.type = 'button'; b.className = 'qmore'; b.textContent = '看完整的問題 ▾'; b.setAttribute('aria-hidden', 'true'); b.tabIndex = -1;
    var tg = function () { var f = q.classList.toggle('fold'); b.textContent = f ? '看完整的問題 ▾' : '收起 ▴'; q.setAttribute('aria-expanded', f ? 'false' : 'true'); };
    q.onclick = function () { var sel = window.getSelection && String(window.getSelection()); if (sel) return; tg(); };   // 正在選字就不要誤觸
    q.onkeydown = function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); tg(); } };
    b.onclick = tg;
    q.parentNode.insertBefore(b, q.nextSibling);
  })(qs[i]);
  // 存成 PDF：用瀏覽器的列印。LINE 內建瀏覽器多半沒有列印功能，就提示用瀏覽器打開
  var pb = document.getElementById('pdfBtn'), ph = document.getElementById('pdfHint');
  if (pb) pb.onclick = function () {
    var inLine = /\bLine\//i.test(navigator.userAgent || '');
    if (inLine || typeof window.print !== 'function') { if (ph) ph.hidden = false; return; }
    window.print();
  };

  }
})();
</script>
</body>
</html>
