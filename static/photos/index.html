<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>補傳面相照片｜大正命理諮詢</title>
<style>
@font-face{font-family:"DazhenWenkai";src:url("/fonts/dazhen-wenkai-400.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"DazhenWenkai";src:url("/fonts/dazhen-wenkai-700.woff2") format("woff2");font-weight:700;font-display:swap}
:root{--ink:#1b2845;--muted:#857c70;--paper:#fbf8f3}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"DazhenWenkai",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;background:var(--paper);color:#2b2b2b;line-height:1.8;padding:18px max(14px,env(safe-area-inset-right,0px)) 30px max(14px,env(safe-area-inset-left,0px))}
.brand{text-align:center;color:var(--ink);font-weight:700;font-size:15px;letter-spacing:.08em;margin:2px 0 6px}
.brand a{color:inherit;text-decoration:none}
.box{position:relative;max-width:480px;margin:0 auto}
iframe{display:block;width:100%;height:760px;border:0;background:transparent}
.load{position:absolute;inset:0;text-align:center;padding:60px 16px;color:var(--muted);font-size:15px;background:var(--paper)}
.bad{max-width:460px;margin:30px auto;background:#fff;border:1px solid #e7e0d4;border-radius:16px;padding:20px 18px}
.bad h1{font-size:20px;color:var(--ink);margin:0 0 6px}
</style>
</head>
<body>
<div class="brand"><a href="/">大正·命理諮詢</a></div>
<div class="box" id="box"><iframe id="f" title="補傳面相照片"></iframe><div class="load" id="load">照片上傳頁載入中，請稍候…</div></div>
<script>
// 大正 11/11：預約成功信「補傳面相照片」按鈕連到這裡（?o=訂單編號&t=訂單憑證），頁面本身在預約系統（?page=photos），這裡只負責嵌進來
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbx3aDlFDBayTKgvGtQMrWrpDMx3WuU5Yd3Uh4c6BJK5kmKpZnBsXH7fK97yrkQkgx9fkQ/exec';
  var q = new URLSearchParams(location.search), o = q.get('o') || '', t = q.get('t') || '';
  if (!/^GRW?\d{8}-\d{2}$/.test(o) || !/^[0-9a-f]{24}$/.test(t)) {
    document.getElementById('box').outerHTML = '<div class="bad"><h1>連結不完整</h1><p>請從預約成功的 Email 再點一次「補傳面相照片」，或直接在 LINE 把照片傳給大正。</p></div>';
    return;
  }
  var f = document.getElementById('f');
  f.addEventListener('load', function () { var l = document.getElementById('load'); if (l) l.remove(); });
  f.src = API + '?page=photos&o=' + encodeURIComponent(o) + '&t=' + encodeURIComponent(t);
})();
</script>
</body>
</html>
